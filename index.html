function classListOccurrences(pastDays=7,futureDays=45){
  const out=[];
  const start=new Date();start.setHours(0,0,0,0);start.setDate(start.getDate()-pastDays);
  const end=new Date();end.setHours(0,0,0,0);end.setDate(end.getDate()+futureDays);
  const explicitKeys=new Set(data.classes.map(c=>`${c.student}|${c.date}|${String(c.time||'').slice(0,5)}`));
  for(let dt=new Date(start);dt<=end;dt.setDate(dt.getDate()+1)){
    const y=dt.getFullYear(),m=dt.getMonth(),d=dt.getDate();
    const date=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    for(const st of data.students){
      const f=st.fixedSchedule||{};const schedules=Array.isArray(f)?f:(f.active&&f.time?[f]:[]);
      schedules.forEach((sch,si)=>{
        if(!sch||!sch.active||!sch.time)return;
        const days=Array.isArray(sch.days)?sch.days.map(Number):[Number(sch.day)];
        const dow=(dt.getDay()+6)%7;if(!days.includes(dow))return;if(st.startDate&&date<st.startDate)return;
        const key=`${st.name}|${date}|${String(sch.time).slice(0,5)}`;if(explicitKeys.has(key))return;
        const fixedId=`fixed-${st.id}-${si}-${date}`;
        const rain=(data.rain||[]).find(r=>String(r.fixedOccurrenceId||'')===fixedId);
        const cancel=(data.cancellations||[]).find(r=>String(r.fixedOccurrenceId||'')===fixedId);
        out.push({id:fixedId,student:st.name,studentId:st.id,date,time:sch.time,duration:Number(sch.duration||1),status:rain?'Lluvia':cancel?'Cancelada':'Fija',note:rain?.note||cancel?.note||'Horario fijo',rainHours:Number(rain?.hours||0),fixed:true});
      });
    }
  }
  for(const c of data.classes){
    if(!c.date||c.date<`${start.getFullYear()}-${String(start.getMonth()+1).padStart(2,'0')}-${String(start.getDate()).padStart(2,'0')}`||c.date>`${end.getFullYear()}-${String(end.getMonth()+1).padStart(2,'0')}-${String(end.getDate()).padStart(2,'0')}`)continue;
    const st=data.students.find(x=>x.name===c.student);
    out.push({...c,studentId:st?.id||null,fixed:false});
  }
  return out.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
}

function studentWeekSort(student){const raw=student.fixedSchedule||[],schedules=Array.isArray(raw)?raw:(raw.active?[raw]:[]);let slots=[];for(const s of schedules){if(!s||s.active===false||!s.time)continue;const days=Array.isArray(s.days)?s.days:[s.day];for(const d of days){const day=Number(d);if(Number.isInteger(day)&&day>=0&&day<=6)slots.push({day,time:String(s.time)})}}slots.sort((a,b)=>a.day-b.day||a.time.localeCompare(b.time));return slots[0]||{day:7,time:'99:99'}}function studentSchedules(st){const raw=st?.fixedSchedule;return Array.isArray(raw)?raw:(raw?.active?[raw]:[])}

function normalizeActivities(){
  const list=Array.isArray(data.activities)?data.activities:[];
  const out=[];
  const byKey=new Map();
  for(const raw of list){
    if(!raw) continue;
    const a={...raw};
    a.name='Escuelita';
    a.days=[...new Set((Array.isArray(a.days)?a.days:[]).map(Number).filter(n=>n>=0&&n<=6))].sort((x,y)=>x-y);
    a.time=String(a.time||'');
    a.duration=Number(a.duration||1);
    a.amount=Number(a.amount||0);
    a.occurrences={...(a.occurrences||{})};
    // Exact duplicate configurations are one Escuelita, not multiple recurring activities.
    const key=`${a.days.join(',')}|${a.time}|${a.duration}`;
    const existing=byKey.get(key);
    if(!existing){
      byKey.set(key,a);
      out.push(a);
    }else{
      // Keep the first configured amount, but preserve any per-date decisions from duplicates.
      if(!existing.amount && a.amount) existing.amount=a.amount;
      for(const [date,occ] of Object.entries(a.occurrences)){
        if(!existing.occurrences[date] || existing.occurrences[date].status==='not_required') existing.occurrences[date]=occ;
      }
    }
  }
  data.activities=out;
  return out;
}

function calendarEventsForDate(date,y,m){
  const fixed=fixedOccurrences(y,m).filter(c=>c.date===date);
  const classes=data.classes.filter(c=>c.date===date&&c.status!=='Cancelada'&&c.status!=='cancelada'&&c.status!=='Lluvia'&&c.status!=='suspendida');
  const standaloneRain=(data.rain||[]).filter(r=>r.date===date&&!r.fixedOccurrenceId).map(r=>{
    const original=r.originalClassId?data.classes.find(x=>String(x.id)===String(r.originalClassId)):null;
    const time=String(r.fixedTime||original?.time||r.time||'').slice(0,5);
    return {id:`rain-${r.id}`,student:r.student,date:r.date,time,duration:Number(r.hours||1),status:'Lluvia',note:r.note||'Suspendida por lluvia',kind:'class',classType:data.students.find(x=>x.name===r.student)?.tariff==='group'?'group':'individual',originalClassId:r.originalClassId||null};
  }).filter(r=>r.time);
  const activities=activityOccurrences(y,m).filter(c=>c.date===date);
  const all=[...fixed,...classes,...standaloneRain,...activities];
  const seen=new Set();
  const unique=all.filter(c=>{
    const kind=c.kind==='activity'?'activity':'class';
    const key=kind==='activity'?`${c.date}|${c.time||''}|${c.activityId||c.name||''}|activity`:`${c.date}|${c.time||''}|${c.student||c.name||''}|class`;
    if(seen.has(key))return false; seen.add(key); return true;
  });
  const grouped=new Map(),result=[];
  for(const c of unique){
    const studentName=c.student||c.name||'';
    const studentObj=data.students.find(x=>String(x.name||'').trim()===String(studentName).trim());
    const isGroup=c.kind!=='activity'&&(c.classType==='group'||c.grouped===true||studentObj?.tariff==='group');
    if(c.status==='Lluvia'&&isGroup){
      const key=`${c.date}|${c.time||''}|rain-group`;
      let g=grouped.get(key);
      if(!g){g={...c,grouped:true,groupMembers:[],student:c.student||c.name||'Clase grupal'};grouped.set(key,g);result.push(g);}
      const name=c.student||c.name; if(name&&!g.groupMembers.includes(name))g.groupMembers.push(name);
    }else result.push(c);
  }
  return result;
}

function calendarEventsForDateList(y,m){
  const last=new Date(y,m+1,0).getDate();
  const out=[];
  for(let d=1;d<=last;d++){
    const date=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    out.push(...calendarEventsForDate(date,y,m));
  }
  return out;
}

async function googleApi(path,options={},retryAuth=true,rateRetries=0){
  if(!googleToken)await ensureGoogleAccessToken();
  const headers=Object.assign({'Authorization':'Bearer '+googleToken,'Content-Type':'application/json'},options.headers||{});
  const res=await fetch('https://www.googleapis.com/calendar/v3/'+path,Object.assign({},options,{headers}));
  const text=await res.text();let body={};try{body=text?JSON.parse(text):{}}catch{}
  if(!res.ok){
    if(res.status===401&&retryAuth){googleToken=null;await refreshPersistentGoogleToken();return googleApi(path,options,false,rateRetries)}
    const reasons=(body.error?.errors||[]).map(x=>String(x.reason||'').toLowerCase());
    const errorMessage=String(body.error?.message||'').toLowerCase();const rateLimited=res.status===429||reasons.includes('ratelimitexceeded')||reasons.includes('userratelimitexceeded')||errorMessage.includes('rate limit');
    if(rateLimited&&rateRetries<4){await new Promise(resolve=>setTimeout(resolve,700*Math.pow(2,rateRetries)));return googleApi(path,options,retryAuth,rateRetries+1)}
    throw new Error(body.error?.message||('Google Calendar error '+res.status))
  }
  return body
}

async function clearGoogleCalendarIfRequested(){
  try{
    const flag=await getConfig('google_clear_requested');
    if(flag!=='1')return;
    await ensureGoogleAccessToken();
    // Primero usamos el endpoint server-side que tiene el refresh token persistente.
    // Esto garantiza la limpieza del calendario que la app tiene registrado aunque
    // el navegador no tenga permisos suficientes para enumerar todos los calendarios.
    try{
      const serverClear=await googleTokenFunction({action:'clear_calendar'});
      if(serverClear?.error)throw new Error(serverClear.error);
    }catch(e){
      console.warn('Limpieza server-side de Google:',e);
    }
    const calendars=[]; let pageToken='';
    do{
      let path='users/me/calendarList?maxResults=250';
      if(pageToken)path+='&pageToken='+encodeURIComponent(pageToken);
      const page=await googleApi(path);
      for(const cal of (page.items||[])){
        if(String(cal.summary||'').trim().toLowerCase()==='clases')calendars.push(cal);
      }
      pageToken=page.nextPageToken||'';
    }while(pageToken);
    if(!calendars.length){
      googleCalendarId=null;
      await setConfig('google_calendar_id','');
      await setConfig('google_clear_requested','0');
      await setConfig('google_activity_event_ids','{}');
      await setConfig('google_fixed_event_ids','{}');
      alert('Google Calendar ya estaba limpio: no encontré calendarios “Clases”.');
      return;
    }
    let keep=calendars.find(c=>String(c.id)===String(googleCalendarId))||calendars[0];
    let deletedEvents=0,deletedCalendars=0;
    // Vaciar por completo el calendario que vamos a conservar.
    let evPage='';
    do{
      let path='calendars/'+encodeURIComponent(keep.id)+'/events?maxResults=2500&showDeleted=false';
      if(evPage)path+='&pageToken='+encodeURIComponent(evPage);
      const page=await googleApi(path);
      for(const ev of (page.items||[])){
        if(!ev.id)continue;
        try{await googleApi('calendars/'+encodeURIComponent(keep.id)+'/events/'+encodeURIComponent(ev.id),{method:'DELETE'});deletedEvents++}catch(e){
          const msg=String(e.message||e).toLowerCase();
          if(!msg.includes('not found')&&!msg.includes('deleted')&&!msg.includes('404')&&!msg.includes('410'))throw e;
        }
      }
      evPage=page.nextPageToken||'';
    }while(evPage);
    // Si había más de un calendario “Clases”, eliminamos los duplicados.
    for(const cal of calendars){
      if(String(cal.id)===String(keep.id))continue;
      try{await googleApi('calendars/'+encodeURIComponent(cal.id),{method:'DELETE'});deletedCalendars++}catch(e){
        const msg=String(e.message||e).toLowerCase();
        if(!msg.includes('not found')&&!msg.includes('deleted')&&!msg.includes('404')&&!msg.includes('410'))throw e;
      }
    }
    googleCalendarId=keep.id;
    await setConfig('google_calendar_id',googleCalendarId);
    await setConfig('google_clear_requested','0');
    await setConfig('google_activity_event_ids','{}');
    await setConfig('google_fixed_event_ids','{}');
    alert(`Google Calendar limpiado. ${deletedEvents} eventos eliminados y ${deletedCalendars} calendario(s) duplicado(s) eliminado(s). Queda un solo calendario “Clases”.`);
  }catch(e){
    console.warn('Google Calendar clear:',e);
    alert('No se pudo limpiar Google Calendar todavía: '+(e.message||e));
  }
}
async function ensureGoogleCalendar(){
  if(!googleCalendarId){const stored=await getConfig('google_calendar_id');if(stored)googleCalendarId=stored;}
  let storedCalendar=null;
  if(googleCalendarId){
    try{storedCalendar=await googleApi(`calendars/${encodeURIComponent(googleCalendarId)}`)}
    catch(e){
      if(!isGoogleMissingResource(e))throw e;
      googleCalendarId=null;
    }
  }
  let calendars=[],pageToken='';
  do{
    const path='users/me/calendarList?maxResults=250'+(pageToken?'&pageToken='+encodeURIComponent(pageToken):'');
    const page=await googleApi(path);
    calendars.push(...(page.items||[]).filter(c=>String(c.summary||'').trim().toLowerCase()==='clases'));
    pageToken=page.nextPageToken||'';
  }while(pageToken);
  const makeCalendar=async()=>{const cal=await googleApi('calendars',{method:'POST',body:JSON.stringify({summary:'Clases',description:'Calendario de clases de Mis Clases'})});googleCalendarId=cal.id;await setConfig('google_calendar_id',googleCalendarId);return googleCalendarId};
  if(!calendars.length){
    if(storedCalendar){googleCalendarId=storedCalendar.id;await setConfig('google_calendar_id',googleCalendarId);return googleCalendarId}
    return await makeCalendar();
  }
  const keep=calendars.find(c=>String(c.id)===String(googleCalendarId))||calendars[0];
  googleCalendarId=keep.id;
  await setConfig('google_calendar_id',googleCalendarId);
  const duplicates=calendars.filter(c=>String(c.id)!==String(keep.id));
  if(!duplicates.length)return googleCalendarId;
  if(!confirm(`Encontré ${calendars.length} calendarios “Clases”. ¿Querés reunir sus eventos en uno solo y eliminar los calendarios duplicados?`))return googleCalendarId;
  const signature=ev=>JSON.stringify([ev.summary||'',ev.start?.dateTime||ev.start?.date||'',ev.end?.dateTime||ev.end?.date||'',ev.description||'']);
  const known=new Set();
  const readEvents=async calendarId=>{
    let token='',events=[];
    do{
      const path=`calendars/${encodeURIComponent(calendarId)}/events?singleEvents=false&showDeleted=false&maxResults=250${token?'&pageToken='+encodeURIComponent(token):''}`;
      const page=await googleApi(path);
      events.push(...(page.items||[]));
      token=page.nextPageToken||'';
    }while(token);
    return events;
  };
  for(const ev of await readEvents(keep.id))known.add(signature(ev));
  for(const duplicate of duplicates){
    for(const ev of await readEvents(duplicate.id)){
      if(!ev.id||ev.status==='cancelled')continue;
      const sig=signature(ev);
      if(!known.has(sig)){
        const body={};
        for(const field of ['summary','description','location','start','end','recurrence','reminders','visibility','transparency','extendedProperties','attendees','colorId'])if(ev[field]!==undefined)body[field]=ev[field];
        await googleApi(`calendars/${encodeURIComponent(keep.id)}/events`,{method:'POST',body:JSON.stringify(body)});
        known.add(sig);
      }
    }
    await googleApi(`calendars/${encodeURIComponent(duplicate.id)}`,{method:'DELETE'});
  }
  return googleCalendarId;
}
function googleDateTime(date,time,durationHours){const start=new Date(`${date}T${(time||'00:00').slice(0,5)}:00`);const end=new Date(start.getTime()+Number(durationHours||1)*3600000);const iso=d=>{const z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}:00`};return {start:iso(start),end:iso(end)} }
function googleStatusTitle(summary,student,status){
  const prefix=status==='rain'?'☂️':status==='cancel'?'❌':'';
  const raw=String(summary||'').replace(/^(?:☂️|❌)\\s*/u,'');
  const parts=raw.split(' + ').map(x=>x.trim()).filter(Boolean);
  if(parts.length>1)return prefix?prefix+' '+parts.join(' + '):parts.join(' + ');
  const idx=parts.findIndex(x=>x===String(student||'').trim());
  if(idx>=0)parts[idx]=prefix?prefix+' '+parts[idx]:parts[idx];
  else if(prefix)return prefix+' '+String(student||raw).trim();
  return parts.join(' + ')||String(student||'');
}
async function syncClassToGoogle(c){
  if(!googleCalendarId)await ensureGoogleCalendar();
  if(String(c.id).startsWith('fixed-'))return;
  let eventId=c.googleEventId;
  if(!eventId&&isUuid(c.id)){
    try{const row=await supabaseClient.from('clases').select('google_event_id').eq('id',c.id).maybeSingle();eventId=row.data?.google_event_id||null}catch{}
  }
  const status=(c.status==='Lluvia'||c.status==='suspendida')?'rain':
    (c.status==='Cancelada'||c.status==='cancelada')?'cancel':'';
  const studentObj=data.students.find(x=>String(x.name).trim()===String(c.student).trim());
  const groupLabel=String(c.note||'').match(/^\[Grupo:([^\]]+)\]/)?.[1]||'';
  const displayStudent=groupLabel||c.student;
  const isGroup=(c.classType==='group'||c.grouped===true||c.grouped==='1'||c.status==='Clase grupal'||(c.status==='Recuperación'&&studentObj?.tariff==='group')||!!groupLabel);
  const ordinaryTitle=(c.status==='Recuperación'?'🔁 ':'')+displayStudent;
  const title=status?googleStatusTitle(displayStudent,displayStudent,status):ordinaryTitle;
  const eventNote=String(c.note||'').replace(/^\[Grupo:[^\]]+\]\s*/,'');
  const dt=googleDateTime(c.date,c.time,c.duration);
  const statusText=status==='rain'?'Suspendida por lluvia · se recupera':
    status==='cancel'?'Cancelada por el alumno · no se recupera':'';
  const body={
    summary:title,
    description:[statusText,eventNote||'Clase creada desde Mis Clases'].filter(Boolean).join(' · '),
    start:{dateTime:dt.start,timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone},
    end:{dateTime:dt.end,timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone},
    extendedProperties:{private:{mis_clases:'1',student:displayStudent,kind:'class',class_status:status||'programada',grouped:isGroup?'1':'0'}}
  };
  if(eventId){
    try{
      await googleApi(`calendars/${encodeURIComponent(googleCalendarId)}/events/${encodeURIComponent(eventId)}`,{method:'PUT',body:JSON.stringify(body)});
      c.googleEventId=eventId;
    }catch(e){
      if(['resource has been deleted','not found','404','410'].some(x=>String(e.message).toLowerCase().includes(x))){eventId=null;c.googleEventId=null;}
      else throw e;
    }
  }
  if(!eventId){
    const ev=await googleApi(`calendars/${encodeURIComponent(googleCalendarId)}/events`,{method:'POST',body:JSON.stringify(body)});
    c.googleEventId=ev.id;
  }
  if(isUuid(c.id)){
    const {error}=await supabaseClient.from('clases').update({google_event_id:c.googleEventId}).eq('id',c.id);
    if(error)throw error;
  }
}

async function cleanupGoogleOrphans(){
  if(!googleCalendarId)return;
  const active=new Set(data.students.map(x=>String(x.name).trim()).filter(Boolean));
  let pageToken='';
  do{
    const dataPage=await googleApi(`calendars/${encodeURIComponent(googleCalendarId)}/events?singleEvents=false&showDeleted=false&maxResults=250${pageToken?'&pageToken='+encodeURIComponent(pageToken):''}`);
    for(const ev of (dataPage.items||[])){
      const pp=ev.extendedProperties?.private||{};
      if(pp.mis_clases!=='1')continue;
      const kind=String(pp.kind||'');
      // Cada tipo de evento se sincroniza por separado. Nunca borrar Escuelita
      // ni otros tipos desde la limpieza de alumnos/clases.
      if(kind==='activity')continue;
      if(kind!=='class' && kind!=='fixed')continue;
      const rawNames=String(pp.student||ev.summary||'').trim();
      const names=rawNames.split(' + ').map(x=>x.trim()).filter(Boolean);
      const looksLikeOurEvent=kind==='class'||kind==='fixed'||String(ev.summary||'').startsWith('R - ');
      if(looksLikeOurEvent && names.length && !names.every(n=>active.has(n))){
        try{await googleApi(`calendars/${encodeURIComponent(googleCalendarId)}/events/${encodeURIComponent(ev.id)}`,{method:'DELETE'})}
        catch(e){if(!isGoogleMissingResource(e))throw e}
      }
    }
    pageToken=dataPage.nextPageToken||'';
  }while(pageToken);
}

async function syncFixedSchedulesToGoogle(){

    const endH=endDate.getHours(),endM=endDate.getMinutes();
    const names=members.map(x=>x.name).filter(Boolean);
    const desiredSummary=names.join(' + ');

    const event={
      summary:desiredSummary,

      start:{dateTime:`${date}T${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:00`,timeZone:tz},
      end:{dateTime:`${date}T${String(endH).padStart(2,'0')}:${String(endM).padStart(2,'0')}:00`,timeZone:tz},
      recurrence:[`RRULE:FREQ=WEEKLY;BYDAY=${['SU','MO','TU','WE','TH','FR','SA'][dow]}`],

        const evNames=String(pp.student||'').split(' + ').map(x=>x.trim()).filter(Boolean).sort().join('|');

      try{
        await googleApi(`calendars/${encodeURIComponent(googleCalendarId)}/events/${encodeURIComponent(eventId)}`,{method:'PUT',body:JSON.stringify(event)});
      }catch(e){
        const msg=String(e.message||e);
        if(!isGoogleMissingResource(e))throw e;
        eventId=null;
      }
    }
    if(!eventId){
      const ev=await googleApi(`calendars/${encodeURIComponent(googleCalendarId)}/events`,{method:'POST',body:JSON.stringify(event)});
      eventId=ev.id;
    }

    usedIds.add(eventId);
    // Guardamos el mismo ID por alumno/día para que lluvia pueda borrar una sola ocurrencia.
    for(const st of members){
      newMap[`${st.id}|${selectedDay}`]=eventId;
    }
    newMap[groupKey]=eventId;
  }

  // Borra eventos fijos antiguos/duplicados que ya no representan horarios actuales.
  for(const [oldId] of existingFixed){
    if(usedIds.has(oldId))continue;
    try{
      await googleApi(`calendars/${encodeURIComponent(googleCalendarId)}/events/${encodeURIComponent(oldId)}`,{method:'DELETE'});
    }catch(e){
      const msg=String(e.message||e);
      if(!isGoogleMissingResource(e))throw e;
    }
  }

  await setConfig(key,JSON.stringify(newMap));
}

 authGate.style.display='flex';authLoading.textContent='Cargando datos…';authLoading.style.display='block';
 try{
  const loaded=await Promise.race([loadFromSupabase(),new Promise((_,reject)=>setTimeout(()=>reject(new Error('La carga de datos tardó demasiado.')),10000))]);
  if(!loaded)throw new Error('No se pudieron cargar los datos.');
 }catch(e){
  console.error('Carga inicial:',e);showAuthError('La sesión se inició, pero no se pudieron cargar los datos: '+(e.message||e));
  authCard?.classList.remove('loading');if(subtitle)subtitle.textContent='Iniciá sesión para acceder a tus clases.';
  authLoading.style.display='none';authGate.style.display='flex';appEntered=false;return;
 }

 try{await initGoogleCalendar()}catch(e){console.warn('Google Calendar:',e)}

async function initAuth(){authLoading.style.display='block';try{const {data:{session}}=await supabaseClient.auth.getSession();currentSession=session;if(session){await enterApp()}else{authGate.style.display='flex'}}catch(err){showAuthError('No se pudo comprobar la sesión: '+(err.message||err));authGate.style.display='flex'}finally{authLoading.style.display='none'}}
authForm.addEventListener('submit',async e=>{e.preventDefault();hideAuthError();authLoading.textContent='Iniciando sesión…';authLoading.style.display='block';const email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPassword').value;const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});authLoading.style.display='none';if(error){showAuthError(error.message.includes('Email not confirmed')?'El email todavía no está confirmado en Supabase.':error.message);return}if(data.session)enterApp()});
supabaseClient.auth.onAuthStateChange((event,session)=>{currentSession=session;if(session && event==='SIGNED_IN')enterApp()});
function scheduleRecoveryDayRefresh(){const now=new Date(),next=new Date(now);next.setHours(24,0,5,0);setTimeout(()=>{renderAll();if(document.getElementById('modal')?.classList.contains('show')&&document.getElementById('sheet')?.textContent.includes('Horas por recuperar'))openRainDebtOverview();scheduleRecoveryDayRefresh()},next-now);}
scheduleRecoveryDayRefresh();
initAuth();
