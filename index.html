async function syncToSupabase(){
  if(!currentSession) return {ok:false};
  try{
    // 1) Alumnos: Supabase is the source of truth for persistent fields.
    for(const st of data.students){
      if(!isUuid(st.id)) st.id=newUuid();
      const row={
        id:st.id,nombre:st.name,edad:Number(st.age)||null,nivel:st.level||null,
        notas:st.notes||null,activo:true,tarifa_tipo:st.tariff||'individual',

        lluvia_horas:Number(st.rainHours||0),recuperadas_horas:Number(st.recoveredHours||0)
      };

      const f=st.fixedSchedule||{};

      if(oldErr) throw oldErr;

        const hrow={alumno_id:st.id,dia_semana:Number(f.day||0),hora:f.time,duracion_minutos:Math.round(Number(f.duration||1)*60),activo:true};
        if(old&&old[0]){const {error}=await supabaseClient.from('horarios_fijos').update(hrow).eq('id',old[0].id);if(error)throw error;}
        else{const {error}=await supabaseClient.from('horarios_fijos').insert(hrow);if(error)throw error;}
      }else if(old&&old[0]){
        const {error}=await supabaseClient.from('horarios_fijos').update({activo:false}).eq('id',old[0].id);if(error)throw error;
      }
    }

    // 2) Clases
    for(const c of data.classes){
      if(!isUuid(c.id)) c.id=newUuid();
      const st=data.students.find(x=>x.name===c.student); if(!st) continue;
      const tipo=(c.status==='Recuperación'||c.status==='recuperacion')?'recuperacion':'individual';
      const estado=(c.status==='Lluvia'||c.status==='suspendida')?'suspendida':(c.status==='realizada'?'realizada':'programada');
      const {error}=await supabaseClient.from('clases').upsert({id:c.id,alumno_id:st.id,fecha:c.date,hora:c.time||'00:00',duracion_minutos:Math.round(Number(c.duration||1)*60),tipo,estado,notas:c.note||null},{onConflict:'id'});
      if(error) throw error;
    }

    // 3) Pagos
    for(const pay of data.payments){
      if(!isUuid(pay.id)) pay.id=newUuid();
      const st=data.students.find(x=>x.name===pay.student); if(!st) continue;
      const {error}=await supabaseClient.from('pagos').upsert({id:pay.id,alumno_id:st.id,monto:Number(pay.amount||0),fecha:pay.date||new Date().toISOString().slice(0,10),concepto:pay.type||null,estado:'pagado'},{onConflict:'id'});
      if(error) throw error;
    }

    // 4) Planes
    for(const pl of data.plans){
      if(!isUuid(pl.id)) pl.id=newUuid();
      const {error}=await supabaseClient.from('planes').upsert({id:pl.id,nombre:pl.title||'Plan',descripcion:null,situacion:pl.situation||null,objetivo_tactico:pl.tactical||null,herramienta_tecnica:pl.technical||null,elemento_control:pl.control||null,principio_biomecanico:pl.bio||null,notas:[pl.game,pl.conditioned,pl.task,pl.regulated].filter(Boolean).join('\n\n')||null},{onConflict:'id'});
      if(error) throw error;
    }

    // 5) Tarifas
    const rateRows=[
      {tipo:'por_clase',nombre:'Pago por clase',precio:Number(data.rates.class||0),activa:true},
      {tipo:'mensual_individual',nombre:'Individual mensual',precio:Number(data.rates.individual||0),activa:true},
      {tipo:'mensual_grupal',nombre:'Grupal mensual',precio:Number(data.rates.group||0),activa:true}
    ];
    for(const r of rateRows){
      const {error}=await supabaseClient.from('tarifas').upsert(r,{onConflict:'tipo'});
      if(error) throw error;
    }

    // 6) Suspensiones por lluvia. Se guardan como clases suspendidas.
    for(const rain of data.rain||[]){
      if(!isUuid(rain.id)) rain.id=newUuid();

    localStorage.setItem(KEY,JSON.stringify(data));

async function deleteGoogleEventsForStudent(name){if(!googleCalendarId||!name)return;const q=encodeURIComponent(name);let pageToken='';do{const data=await googleApi(`calendars/${encodeURIComponent(googleCalendarId)}/events?singleEvents=false&showDeleted=false&maxResults=250&q=${q}${pageToken?'&pageToken='+encodeURIComponent(pageToken):''}`);for(const ev of (data.items||[])){const summary=ev.summary||'';if(summary===`Clase · ${name}`||summary===`Recuperación · ${name}`||ev.extendedProperties?.private?.student===name){try{await googleApi(`calendars/${encodeURIComponent(googleCalendarId)}/events/${encodeURIComponent(ev.id)}`,{method:'DELETE'})}catch(e){if(!['Not Found','Resource has been deleted','404','410'].some(x=>String(e.message).includes(x)))throw e}}}pageToken=data.nextPageToken||''}while(pageToken)}

async function syncFixedSuspensionsToGoogle(){if(!googleCalendarId)return;let map={};try{map=JSON.parse(await getConfig('google_fixed_event_ids')||'{}')}catch{};for(const rain of (data.rain||[])){if(!rain.fixedOccurrenceId||!rain.fixedStudentId||!rain.date)continue;const seriesId=map[rain.fixedStudentId];if(!seriesId)continue;try{const tz=Intl.DateTimeFormat().resolvedOptions().timeZone;const startLocal=new Date(`${rain.date}T00:00:00`);const endLocal=new Date(startLocal.getTime()+86400000);const params=`singleEvents=true&showDeleted=false&timeMin=${encodeURIComponent(startLocal.toISOString())}&timeMax=${encodeURIComponent(endLocal.toISOString())}&maxResults=20`;const res=await googleApi(`calendars/${encodeURIComponent(googleCalendarId)}/events/${encodeURIComponent(seriesId)}/instances?${params}`,{method:'GET'});for(const ev of (res.items||[])){const instDate=String(ev.originalStartTime?.dateTime||ev.start?.dateTime||'').slice(0,10);if(instDate===rain.date){try{await googleApi(`calendars/${encodeURIComponent(googleCalendarId)}/events/${encodeURIComponent(ev.id)}`,{method:'DELETE'})}catch(e){if(!['Not Found','Resource has been deleted','404','410'].some(x=>String(e.message).includes(x)))throw e}}}}catch(e){console.warn('No se pudo suspender la ocurrencia fija en Google Calendar:',e)}}}
async function syncFixedSchedulesToGoogle(){const key='google_fixed_event_ids';let map={};try{map=JSON.parse(await getConfig(key)||'{}')}catch{}const activeIds=new Set();for(const st of data.students){const f=st.fixedSchedule;if(!f?.active||!f.time)continue;activeIds.add(String(st.id));const tz=Intl.DateTimeFormat().resolvedOptions().timeZone;const selectedDay=Number(f.day);const dow=(selectedDay+1)%7;const [hh,mm]=String(f.time).slice(0,5).split(':').map(Number);const start=new Date();start.setHours(hh,mm,0,0);const today=start.getDay();const targetGoogleDay=dow;let daysUntil=(targetGoogleDay-today+7)%7;if(daysUntil===0 && start.getTime()<=Date.now())daysUntil=7;start.setDate(start.getDate()+daysUntil);const date=start.toISOString().slice(0,10);const endDate=new Date(start.getTime()+Number(f.duration||1)*3600000);const endH=endDate.getHours(),endM=endDate.getMinutes();const event={summary:'Clase · '+st.name,description:'Horario fijo de Mis Clases',start:{dateTime:`${date}T${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:00`,timeZone:tz},end:{dateTime:`${date}T${String(endH).padStart(2,'0')}:${String(endM).padStart(2,'0')}:00`,timeZone:tz},recurrence:[`RRULE:FREQ=WEEKLY;BYDAY=${['SU','MO','TU','WE','TH','FR','SA'][dow]}`],extendedProperties:{private:{mis_clases:'1',student:st.name,kind:'fixed'}}};const old=map[st.id];if(old){try{await googleApi(`calendars/${encodeURIComponent(googleCalendarId)}/events/${encodeURIComponent(old)}`,{method:'PUT',body:JSON.stringify(event)})}catch(e){if(!['Not Found','Resource has been deleted','404','410'].some(x=>String(e.message).includes(x)))throw e;delete map[st.id]}}if(!map[st.id]){const ev=await googleApi(`calendars/${encodeURIComponent(googleCalendarId)}/events`,{method:'POST',body:JSON.stringify(event)});map[st.id]=ev.id}}for(const id of Object.keys(map)){if(!activeIds.has(String(id))){try{await googleApi(`calendars/${encodeURIComponent(googleCalendarId)}/events/${encodeURIComponent(map[id])}`,{method:'DELETE'})}catch(e){if(!['Not Found','Resource has been deleted','404','410'].some(x=>String(e.message).includes(x)))throw e}delete map[id]}}await setConfig(key,JSON.stringify(map))}
function requestGoogleToken(prompt=''){return new Promise((resolve,reject)=>{if(!window.google?.accounts?.oauth2)return reject(new Error('Google todavía está cargando.'));googleTokenClient=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:GOOGLE_SCOPE,callback:response=>{if(response.error){reject(new Error(response.error_description||response.error));return}googleToken=response.access_token;resolve(googleToken)}});googleTokenClient.requestAccessToken({prompt});})}
async function ensureGoogleAccessToken(){if(googleToken)return googleToken;return await requestGoogleToken('')}
async function syncAllToGoogle(auto=false){await ensureGoogleAccessToken();await ensureGoogleCalendar();await cleanupGoogleOrphans();for(const c of data.classes)await syncClassToGoogle(c);await syncFixedSchedulesToGoogle();await syncFixedSuspensionsToGoogle();updateGoogleStatus();return true}
function connectGoogleCalendar(){if(!window.google?.accounts?.oauth2){alert('Google todavía está cargando. Probá de nuevo en unos segundos.');return}requestGoogleToken(googleCalendarId?'':'consent').then(()=>syncAllToGoogle()).then(()=>alert('Google Calendar conectado. Tus clases están en el calendario “Clases”.')).catch(e=>{console.error(e);alert('No se pudo sincronizar Google Calendar: '+(e.message||e))});}
async function initGoogleCalendar(){try{googleCalendarId=await getConfig('google_calendar_id');updateGoogleStatus()}catch(e){console.warn('Google Calendar config:',e.message)} }
function vals(f){return Object.fromEntries(new FormData(f).entries())}async function saveStudent(e,id){e.preventDefault();let v=vals(e.target),rate=v.tariff==='class'?data.rates.class:v.tariff==='group'?data.rates.group:data.rates.individual;let fixed={active:e.target.fixedActive.checked,day:Number(v.fixedDay),time:v.fixedTime,duration:Number(v.fixedDuration||1)};if(id && id!=='0'){let x=data.students.find(a=>a.id==id);if(!x){alert('No se encontró el alumno para editar.');return}Object.assign(x,{name:v.name,age:Number(v.age),level:v.level,tariff:v.tariff,price:rate,notes:v.notes,fixedSchedule:fixed})}else data.students.push({id:newUuid(),name:v.name,age:Number(v.age),level:v.level,tariff:v.tariff,price:rate,paid:false,hits:{},rainHours:0,recoveredHours:0,fixedSchedule:fixed,notes:v.notes});renderAll();const result=await syncToSupabase();if(!result.ok){alert('No se pudo guardar en Supabase: '+(result.error?.message||result.error||'error desconocido'));return}closeModal();localStorage.setItem(KEY,JSON.stringify(data));}
async function deleteStudent(id){const x=data.students.find(a=>String(a.id)===String(id));if(!x)return;if(!confirm(`¿Eliminar a ${x.name}?\n\nSe eliminarán también sus clases, pagos, horarios y recuperaciones.`))return;try{if(googleCalendarId){try{await deleteGoogleEventsForStudent(x.name)}catch(e){console.warn('No se pudieron borrar los eventos de Google Calendar:',e)}}const sid=x.id;const [aRes,pRes,hRes,cRes]=await Promise.all([supabaseClient.from('alumnos').delete().eq('id',sid),supabaseClient.from('pagos').delete().eq('alumno_id',sid),supabaseClient.from('horarios_fijos').delete().eq('alumno_id',sid),supabaseClient.from('clases').delete().eq('alumno_id',sid)]);for(const r of [aRes,pRes,hRes,cRes])if(r.error)throw r.error;data.students=data.students.filter(a=>String(a.id)!==String(id));data.classes=data.classes.filter(c=>c.student!==x.name);data.payments=data.payments.filter(p=>p.student!==x.name);data.rain=data.rain.filter(r=>r.student!==x.name);window.openStudentCards?.delete(String(id));localStorage.setItem(KEY,JSON.stringify(data));renderAll();if(googleCalendarId){try{await syncAllToGoogle(true)}catch(e){console.warn('Google Calendar cleanup after delete:',e)}}}catch(err){alert('No se pudo eliminar el alumno: '+(err.message||err));}}
function editStudent(id){openModal('student',id)}
function saveClass(e){e.preventDefault();let v=vals(e.target);data.classes.push({id:Date.now(),student:v.student,date:v.date,time:v.time,duration:Number(v.duration),status:v.type||'Clase suelta',note:v.note});closeModal();save()}
async function saveRainStudent(e,id){e.preventDefault();let v=vals(e.target),x=data.students.find(a=>a.id==id),h=Number(v.hours||0);if(!x)return;if(v.action==='rain'){const selectedId=v.classToSuspend;const isFixed=String(selectedId||'').startsWith('fixed-');const original=isFixed?null:(selectedId?data.classes.find(c=>String(c.id)===String(selectedId)):null);let occDate=v.date,occTime='';if(isFixed){const parts=String(selectedId).split('-');occDate=parts.slice(-3).join('-');const f=x.fixedSchedule||{};occTime=f.time||'';}else if(original){occDate=original.date;occTime=original.time||'';}x.rainHours=Number(x.rainHours||0)+h;const rainId=newUuid();data.rain.push({id:rainId,student:x.name,date:occDate,hours:h,note:v.note||'Suspensión por lluvia',recoveryId:null,originalClassId:original?.id||null,fixedOccurrenceId:isFixed?selectedId:null,fixedStudentId:isFixed?String(x.id):null,fixedTime:isFixed?occTime:null});if(original){original.status='Lluvia';original.note=(original.note?original.note+' · ':'')+'Suspendida por lluvia';original.rainSuspensionId=rainId;}}else{x.recoveredHours=Math.min(Number(x.rainHours||0),Number(x.recoveredHours||0)+h);data.classes.push({id:newUuid(),student:x.name,date:v.date,time:v.time||'',duration:h,status:'Recuperación',note:v.note||'Recuperación'});}closeModal();await save()}
function togglePaid(id){const x=data.students.find(a=>a.id==id);if(!x)return;x.paid=!x.paid;if(x.paid){const existing=data.payments.some(p=>p.student===x.name&&Number(p.amount)===Number(x.price)&&p.type===x.tariff);if(!existing){data.payments.push({id:Date.now(),student:x.name,amount:Number(x.price),type:x.tariff||'individual',date:new Date().toISOString().slice(0,10)});}}else{const idx=[...data.payments].map((p,i)=>[p,i]).reverse().find(([p])=>p.student===x.name&&Number(p.amount)===Number(x.price));if(idx)data.payments.splice(idx[1],1);}save()}function savePayment(e){e.preventDefault();let v=vals(e.target);data.payments.push({id:Date.now(),student:v.student,amount:Number(v.amount),type:v.type,date:v.date});let x=data.students.find(a=>a.name===v.student);if(x)x.paid=true;closeModal();save()}function suggestAmount(){let t=document.getElementById('ptype')?.value;if(document.getElementById('pamount'))document.getElementById('pamount').value=data.rates[t==='class'?'class':t==='group'?'group':'individual']}function saveRates(e){e.preventDefault();let v=vals(e.target);data.rates={class:Number(v.class),individual:Number(v.individual),group:Number(v.group)};closeModal();save()}function savePlan(e){e.preventDefault();data.plans.push({id:Date.now(),...vals(e.target)});closeModal();save()}function deletePlan(id){data.plans=data.plans.filter(x=>x.id!=id);save()}function setTheme(v){document.body.classList.toggle('dark',v==='dark');localStorage.setItem('mcTheme',v)}function setFont(v){document.body.classList.remove('font-system','font-inter','font-segoe','font-avenir','font-georgia');document.body.classList.add('font-'+v);localStorage.setItem('mcFont',v)}function loadAppearance(){setTheme(localStorage.getItem('mcTheme')||'light');setFont(localStorage.getItem('mcFont')||'system')}function resetData(){if(confirm('¿Restaurar datos de ejemplo?')){localStorage.removeItem(KEY);location.reload()}}loadAppearance();document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
const authGate=document.getElementById('authGate'),authForm=document.getElementById('authForm'),authError=document.getElementById('authError'),authLoading=document.getElementById('authLoading');
function showAuthError(msg){authError.textContent=msg;authError.style.display='block'}
function hideAuthError(){authError.textContent='';authError.style.display='none'}
let currentSession=null;
async function loadFromSupabase(){
  if(!currentSession) return false;
  try{
    // Keep the current local cache available in case this is the first device
    // connecting after the data was created locally.
    const localSnapshot=JSON.parse(localStorage.getItem(KEY)||"null");
    const [aRes,hRes,cRes,pRes,plRes,tRes]=await Promise.all([
      supabaseClient.from('alumnos').select('*').order('created_at'),
      supabaseClient.from('horarios_fijos').select('*'),
      supabaseClient.from('clases').select('*').order('fecha').order('hora'),
      supabaseClient.from('pagos').select('*').order('fecha'),
      supabaseClient.from('planes').select('*').order('created_at'),
      supabaseClient.from('tarifas').select('*').eq('activa',true)
    ]);
    for(const r of [aRes,hRes,cRes,pRes,plRes,tRes]) if(r.error) throw r.error;

    // If Supabase is genuinely empty but this device has local data, migrate it once.
    // This is important for the first PC->Supabase transition.
    const remoteStudents=aRes.data||[];
    const remoteHasData=remoteStudents.length || (cRes.data||[]).length || (pRes.data||[]).length || (plRes.data||[]).length || (tRes.data||[]).length;
    if(!remoteHasData && localSnapshot && Array.isArray(localSnapshot.students) && localSnapshot.students.length){
      const previous=data;
      data=localSnapshot;
      const migrated=await syncToSupabase();
      if(migrated.ok){
        return await loadFromSupabase();
      }
      data=previous;
      throw migrated.error||new Error('No se pudo migrar la información local a Supabase');
    }
    const remotePayments=(pRes.data||[]).filter(p=>p.estado==='pagado');
    const nameById={};
    remoteStudents.forEach(st=>nameById[st.id]=st.nombre);

    data.students=remoteStudents.map(st=>{
      const f=(hRes.data||[]).find(h=>h.alumno_id===st.id&&h.activo);
      return {
        id:st.id,name:st.nombre,age:st.edad||'',level:st.nivel||'',notes:st.notas||'',
        tariff:st.tarifa_tipo||'individual',price:Number(st.precio||0)||data.rates.individual,
        paid:!!st.pagado,hits:st.golpes||{},rainHours:Number(st.lluvia_horas||0),
        recoveredHours:Number(st.recuperadas_horas||0),
        fixedSchedule:f?{active:true,day:f.dia_semana,time:String(f.hora).slice(0,5),duration:Number(f.duracion_minutos||60)/60}:{active:false,day:0,time:'',duration:1}
      };
    });

    // Payments are authoritative too; if a payment exists for an active student, reflect it.
    const paidByStudent={};
    remotePayments.forEach(p=>{paidByStudent[p.alumno_id]=true;});
    data.students.forEach(st=>{ if(paidByStudent[st.id]) st.paid=true; });

    data.classes=(cRes.data||[]).map(c=>({
      id:c.id,student:nameById[c.alumno_id]||'',date:c.fecha,time:String(c.hora||'').slice(0,5),
      duration:Number(c.duracion_minutos||60)/60,
      status:c.tipo==='recuperacion'?'Recuperación':(c.estado==='suspendida'?'Lluvia':'Clase suelta'),note:c.notas||''
    }));
    data.rain=(cRes.data||[]).filter(c=>c.estado==='suspendida').map(c=>({
      id:c.id,student:nameById[c.alumno_id]||'',date:c.fecha,hours:Number(c.duracion_minutos||60)/60,note:c.notas||'',recoveryId:null
    }));
    const remoteRates=tRes.data||[];
    for(const r of remoteRates){
      if(r.tipo==='por_clase') data.rates.class=Number(r.precio||0);
      if(r.tipo==='mensual_individual') data.rates.individual=Number(r.precio||0);
      if(r.tipo==='mensual_grupal') data.rates.group=Number(r.precio||0);
    }
    data.payments=remotePayments.map(p=>({id:p.id,student:nameById[p.alumno_id]||'',amount:Number(p.monto||0),type:p.concepto||'individual',date:p.fecha}));
    data.plans=(plRes.data||[]).map(p=>{const parts=(p.notas||'').split(/\n\n/);return {id:p.id,title:p.nombre,game:parts[0]||'',conditioned:parts[1]||'',task:parts[2]||'',regulated:parts[3]||'',situation:p.situacion||'',tactical:p.objetivo_tactico||'',technical:p.herramienta_tecnica||'',control:p.elemento_control||'',bio:p.principio_biomecanico||''};});
    data.rain=[];
    localStorage.setItem(KEY,JSON.stringify(data));
    return true;
  }catch(err){
    console.error('Supabase load error:',err);
    showAuthError('No se pudieron cargar los datos: '+(err.message||err));
    return false;
  }
}
let appEntered=false; async function enterApp(){if(appEntered)return;appEntered=true;authGate.style.display='none';await loadFromSupabase();await initGoogleCalendar();renderAll()}
async function initAuth(){authLoading.style.display='block';try{const {data:{session}}=await supabaseClient.auth.getSession();currentSession=session;if(session){await enterApp()}else{authGate.style.display='flex'}}catch(err){showAuthError('No se pudo comprobar la sesión: '+(err.message||err));authGate.style.display='flex'}finally{authLoading.style.display='none'}}
authForm.addEventListener('submit',async e=>{e.preventDefault();hideAuthError();authLoading.textContent='Iniciando sesión…';authLoading.style.display='block';const email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPassword').value;const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});authLoading.style.display='none';if(error){showAuthError(error.message.includes('Email not confirmed')?'El email todavía no está confirmado en Supabase.':error.message);return}if(data.session)enterApp()});
supabaseClient.auth.onAuthStateChange((event,session)=>{currentSession=session;if(session && event==='SIGNED_IN')enterApp()});
initAuth();
</script></body></html>
