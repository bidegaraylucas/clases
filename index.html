async function syncToSupabase(){
  if(!currentSession) return {ok:false};
  try{
    // 1) Alumnos: Supabase is the source of truth for persistent fields.
    for(const st of data.students){
      if(!isUuid(st.id)) st.id=newUuid();
      const row={
        id:st.id,nombre:st.name,edad:Number(st.age)||null,nivel:st.level||null,
        notas:st.notes||null,activo:true,tarifa_tipo:st.tariff||'individual',
        precio:Number(st.price)||0,pagado:!!st.paid,golpes:st.hits||{},
        lluvia_horas:Number(st.rainHours||0),recuperadas_horas:Number(st.recoveredHours||0),fecha_inicio:st.startDate||null
      };
      const {error}=await supabaseClient.from('alumnos').upsert(row,{onConflict:'id'});
      if(error) throw error;

      const schedules=Array.isArray(st.fixedSchedule)?st.fixedSchedule:(st.fixedSchedule?.active?[st.fixedSchedule]:[]);
      const {data:old,error:oldErr}=await supabaseClient.from('horarios_fijos').select('id').eq('alumno_id',st.id);
      if(oldErr) throw oldErr;
      if(old&&old.length){const {error}=await supabaseClient.from('horarios_fijos').update({activo:false}).eq('alumno_id',st.id);if(error)throw error;}
      for(const f of schedules){if(!f?.time)continue;for(const day of (f.days||[f.day])){const hrow={alumno_id:st.id,dia_semana:Number(day||0),hora:f.time,duracion_minutos:Math.round(Number(f.duration||1)*60),activo:true};const {error}=await supabaseClient.from('horarios_fijos').insert(hrow);if(error)throw error;}}
    }

    // 2) Clases
    for(const c of data.classes){
      if(!isUuid(c.id)) c.id=newUuid();
      const st=data.students.find(x=>x.name===c.student); if(!st) continue;
      const tipo=(c.status==='Recuperación'||c.status==='recuperacion')?'recuperacion':'individual';
      const estado=(c.status==='Lluvia'||c.status==='suspendida')?'suspendida':(c.status==='Cancelada'||c.status==='cancelada')?'cancelada':(c.status==='realizada'?'realizada':'programada');
      const {error}=await supabaseClient.from('clases').upsert({id:c.id,alumno_id:st.id,fecha:c.date,hora:c.time||'00:00',duracion_minutos:Math.round(Number(c.duration||1)*60),tipo,estado,notas:c.note||null},{onConflict:'id'});
      if(error) throw error;
    }

    // 3) Pagos
    for(const pay of data.payments){
      if(!isUuid(pay.id)) pay.id=newUuid();
      const st=data.students.find(x=>x.name===pay.student); if(!st) continue;
      const {error}=await supabaseClient.from('pagos').upsert({id:pay.id,alumno_id:st.id,monto:Number(pay.amount||0),fecha:pay.date||new Date().toISOString().slice(0,10),concepto:pay.type||null,estado:'pagado'},{onConflict:'id'});
      if(error) throw error;
    }

    // 4) Planes
    for(const pl of data.plans){
      if(!isUuid(pl.id)) pl.id=newUuid();
      const {error}=await supabaseClient.from('planes').upsert({id:pl.id,nombre:pl.title||'Plan',descripcion:pl.student||null,situacion:pl.situation||null,objetivo_tactico:pl.tactical||null,herramienta_tecnica:pl.technical||null,elemento_control:pl.control||null,principio_biomecanico:pl.bio||null,notas:[pl.game,pl.conditioned,pl.task,pl.regulated].filter(Boolean).join('\n\n')||null},{onConflict:'id'});
      if(error) throw error;
    }

    // 5) Tarifas
    const rateRows=[
      {tipo:'por_clase',nombre:'Pago por clase',precio:Number(data.rates.class||0),activa:true},
      {tipo:'mensual_individual',nombre:'Individual mensual',precio:Number(data.rates.individual||0),activa:true},
      {tipo:'mensual_grupal',nombre:'Grupal mensual',precio:Number(data.rates.group||0),activa:true}
    ];
    for(const r of rateRows){
      const {error}=await supabaseClient.from('tarifas').upsert(r,{onConflict:'tipo'});
      if(error) throw error;
    }

    // 6) Suspensiones por lluvia. La fuente completa es configuración para conservar
    // la ocurrencia fija, el horario y la clase original sin crear duplicados en clases.
    for(const rain of data.rain||[]){ if(!isUuid(rain.id)) rain.id=newUuid(); }
    await setConfig('suspensiones_lluvia',JSON.stringify(data.rain||[]));

    await setConfig('actividades_recurrentes',JSON.stringify(data.activities||[]));
    await setConfig('cancelaciones_alumno',JSON.stringify(data.cancellations||[]));
    await setConfig('estados_clases_fijas',JSON.stringify(data.fixedOverrides||[]));
    localStorage.setItem(KEY,JSON.stringify(data));
    return {ok:true};
  }catch(err){console.error('Supabase sync error:',err);return {ok:false,error:err};}
}
async function save(){

  localStorage.setItem(KEY,JSON.stringify(data));

  if(!result.ok && result.error){ console.error(result.error); alert('No se pudo sincronizar con Supabase: '+(result.error.message||result.error)); return false; }
  localStorage.setItem(KEY,JSON.stringify(data));

  // The OAuth access token is short-lived, so refresh it silently when needed.

  }catch(err){
    console.error('Google Calendar auto-sync:',err);
    if(googleCalendarId) alert('La clase se guardó, pero no se pudo sincronizar con Google Calendar: '+(err.message||err));
  }

}

function normalizeActivities(){
  const list=Array.isArray(data.activities)?data.activities:[];
  const out=[];
  const byKey=new Map();
  for(const raw of list){
    if(!raw) continue;
    const a={...raw};
    a.name='Escuelita';
    a.days=[...new Set((Array.isArray(a.days)?a.days:[]).map(Number).filter(n=>n>=0&&n<=6))].sort((x,y)=>x-y);
    a.time=String(a.time||'');
    a.duration=Number(a.duration||1);
    a.amount=Number(a.amount||0);
    a.occurrences={...(a.occurrences||{})};
    // Exact duplicate configurations are one Escuelita, not multiple recurring activities.
    const key=`${a.days.join(',')}|${a.time}|${a.duration}`;
    const existing=byKey.get(key);
    if(!existing){
      byKey.set(key,a);
      out.push(a);

async function clearGoogleCalendarIfRequested(){
  try{
    const flag=await getConfig('google_clear_requested');
    if(flag!=='1')return;
    await ensureGoogleAccessToken();
    // Primero usamos el endpoint server-side que tiene el refresh token persistente.
    // Esto garantiza la limpieza del calendario que la app tiene registrado aunque
    // el navegador no tenga permisos suficientes para enumerar todos los calendarios.
    try{
      const serverClear=await googleTokenFunction({action:'clear_calendar'});
      if(serverClear?.error)throw new Error(serverClear.error);
    }catch(e){
      console.warn('Limpieza server-side de Google:',e);
    }
    const calendars=[]; let pageToken='';
    do{
      let path='users/me/calendarList?maxResults=250';
      if(pageToken)path+='&pageToken='+encodeURIComponent(pageToken);
      const page=await googleApi(path);
      for(const cal of (page.items||[])){
        if(String(cal.summary||'').trim().toLowerCase()==='clases')calendars.push(cal);
      }
      pageToken=page.nextPageToken||'';
    }while(pageToken);
    if(!calendars.length){
      googleCalendarId=null;
      await setConfig('google_calendar_id','');
      await setConfig('google_clear_requested','0');
      await setConfig('google_activity_event_ids','{}');
      await setConfig('google_fixed_event_ids','{}');
      alert('Google Calendar ya estaba limpio: no encontré calendarios “Clases”.');
      return;
    }
    let keep=calendars.find(c=>String(c.id)===String(googleCalendarId))||calendars[0];
    let deletedEvents=0,deletedCalendars=0;
    // Vaciar por completo el calendario que vamos a conservar.
    let evPage='';
    do{
      let path='calendars/'+encodeURIComponent(keep.id)+'/events?maxResults=2500&showDeleted=false';
      if(evPage)path+='&pageToken='+encodeURIComponent(evPage);
      const page=await googleApi(path);
      for(const ev of (page.items||[])){
        if(!ev.id)continue;
        try{await googleApi('calendars/'+encodeURIComponent(keep.id)+'/events/'+encodeURIComponent(ev.id),{method:'DELETE'});deletedEvents++}catch(e){
          const msg=String(e.message||e).toLowerCase();
          if(!msg.includes('not found')&&!msg.includes('deleted')&&!msg.includes('404')&&!msg.includes('410'))throw e;
        }
      }
      evPage=page.nextPageToken||'';
    }while(evPage);
    // Si había más de un calendario “Clases”, eliminamos los duplicados.
    for(const cal of calendars){
      if(String(cal.id)===String(keep.id))continue;
      try{await googleApi('calendars/'+encodeURIComponent(cal.id),{method:'DELETE'});deletedCalendars++}catch(e){
        const msg=String(e.message||e).toLowerCase();
        if(!msg.includes('not found')&&!msg.includes('deleted')&&!msg.includes('404')&&!msg.includes('410'))throw e;
      }
    }
    googleCalendarId=keep.id;
    await setConfig('google_calendar_id',googleCalendarId);
    await setConfig('google_clear_requested','0');
    await setConfig('google_activity_event_ids','{}');
    await setConfig('google_fixed_event_ids','{}');
    alert(`Google Calendar limpiado. ${deletedEvents} eventos eliminados y ${deletedCalendars} calendario(s) duplicado(s) eliminado(s). Queda un solo calendario “Clases”.`);
  }catch(e){
    console.warn('Google Calendar clear:',e);
    alert('No se pudo limpiar Google Calendar todavía: '+(e.message||e));
  }
}
async function ensureGoogleCalendar(){
  const makeCalendar=async()=>{const cal=await googleApi('calendars',{method:'POST',body:JSON.stringify({summary:'Clases',description:'Calendario de clases de Mis Clases'})});googleCalendarId=cal.id;await setConfig('google_calendar_id',googleCalendarId);return googleCalendarId};
  if(!googleCalendarId){const stored=await getConfig('google_calendar_id');if(stored)googleCalendarId=stored;}
  if(googleCalendarId){
    try{await googleApi(`calendars/${encodeURIComponent(googleCalendarId)}`);return googleCalendarId}
    catch(e){
      const msg=String(e.message||e).toLowerCase();
      if(msg.includes('resource has been deleted')||msg.includes('not found')||msg.includes('404')||msg.includes('410')){googleCalendarId=null;await setConfig('google_calendar_id','');return await makeCalendar();}
      throw e;
    }
  }
  return await makeCalendar();
}
function googleDateTime(date,time,durationHours){const start=new Date(`${date}T${(time||'00:00').slice(0,5)}:00`);const end=new Date(start.getTime()+Number(durationHours||1)*3600000);const iso=d=>{const z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}:00`};return {start:iso(start),end:iso(end)} }
function googleStatusTitle(summary,student,status){
  const prefix=status==='rain'?'☂️':status==='cancel'?'❌':'';
  const raw=String(summary||'').replace(/^(?:☂️|❌)\\s*/u,'');
  const parts=raw.split(' + ').map(x=>x.trim()).filter(Boolean);
  const idx=parts.findIndex(x=>x===String(student||'').trim());
  if(idx>=0)parts[idx]=prefix?prefix+' '+parts[idx]:parts[idx];
  else if(prefix)return prefix+' '+String(student||raw).trim();
  return parts.join(' + ')||String(student||'');
}

async function cleanupGoogleOrphans(){

    const dataPage=await googleApi(`calendars/${encodeURIComponent(googleCalendarId)}/events?singleEvents=false&showDeleted=false&maxResults=250${pageToken?'&pageToken='+encodeURIComponent(pageToken):''}`);

      if(pp.mis_clases!=='1')continue;
      const kind=String(pp.kind||'');
      // Cada tipo de evento se sincroniza por separado. Nunca borrar Escuelita
      // ni otros tipos desde la limpieza de alumnos/clases.
      if(kind==='activity')continue;
      if(kind!=='class' && kind!=='fixed')continue;
      const rawNames=String(pp.student||ev.summary||'').trim();
      const names=rawNames.split(' + ').map(x=>x.trim()).filter(Boolean);
      const looksLikeOurEvent=kind==='class'||kind==='fixed'||String(ev.summary||'').startsWith('R - ');

        catch(e){if(!['Not Found','Resource has been deleted','404','410'].some(x=>String(e.message).includes(x)))throw e}
      }
    }

  }while(pageToken);
}

async function syncFixedSchedulesToGoogle(){
  const key='google_fixed_event_ids';
  let oldMap={};
  try{oldMap=JSON.parse(await getConfig(key)||'{}')}catch{}
  const tz=Intl.DateTimeFormat().resolvedOptions().timeZone;

  // Recuperamos todos los eventos fijos actuales para poder reutilizarlos y limpiar duplicados.
  const existingFixed=new Map();
  let pageToken='';
  do{
    const qs=`singleEvents=false&showDeleted=false&maxResults=250${pageToken?'&pageToken='+encodeURIComponent(pageToken):''}`;
    const page=await googleApi(`calendars/${encodeURIComponent(googleCalendarId)}/events?${qs}`);
    for(const ev of (page.items||[])){
      const pp=ev.extendedProperties?.private||{};
      if(pp.mis_clases==='1' && pp.kind==='fixed') existingFixed.set(ev.id,ev);
    }
    pageToken=page.nextPageToken||'';
  }while(pageToken);

  // Normalizamos todos los horarios semanales de cada alumno.
  // Cada combinación día + hora + duración genera una serie semanal independiente.
  const groups=new Map();
  for(const st of data.students){
    const raw=st.fixedSchedule;
    const schedules=Array.isArray(raw)?raw:(raw?.active?[raw]:[]);
    for(const sch of schedules){
      if(!sch?.active||!sch.time)continue;
      const days=Array.isArray(sch.days)?sch.days.map(Number):[Number(sch.day)];
      for(const selectedDay of days.filter(d=>Number.isInteger(d)&&d>=0&&d<=6)){
        const time=String(sch.time).slice(0,5);
        const duration=Number(sch.duration||1);
        const isGroup=st.tariff==='group';
        const groupKey=isGroup
          ? `group|${selectedDay}|${time}|${duration}|${st.startDate||''}`
          : `student|${st.id}|${selectedDay}|${time}|${duration}|${st.startDate||''}`;
        if(!groups.has(groupKey))groups.set(groupKey,{day:selectedDay,time,duration,startDate:st.startDate||'',members:[]});
        const groupMembers=groups.get(groupKey).members;
        if(!groupMembers.some(x=>String(x.id)===String(st.id)))groupMembers.push(st);
      }
    }
  }

  const newMap={};
  const usedIds=new Set();
  for(const [groupKey,g] of groups){
    const members=g.members;
    const selectedDay=Number(g.day);
    const dow=(selectedDay+1)%7; // Google: Sun=0, Mon=1...
    const [hh,mm]=g.time.split(':').map(Number);
    // Parseamos la fecha de inicio como fecha LOCAL. new Date('YYYY-MM-DD')
    // se interpreta como UTC en el navegador y en Argentina puede caer en el día anterior.
    let start;
    if(g.startDate && /^\d{4}-\d{2}-\d{2}$/.test(g.startDate)){
      const [yy,mo,dd]=g.startDate.split('-').map(Number);
      start=new Date(yy,mo-1,dd,hh,mm,0,0);
    }else{
      const now=new Date();
      start=new Date(now.getFullYear(),now.getMonth(),now.getDate(),hh,mm,0,0);
    }
    if(Number.isNaN(start.getTime())) continue;
    const today=start.getDay();
    let daysUntil=(dow-today+7)%7;
    if(daysUntil===0 && start.getTime()<=Date.now())daysUntil=7;
    start.setDate(start.getDate()+daysUntil);
    const date=start.toISOString().slice(0,10);
    const endDate=new Date(start.getTime()+g.duration*3600000);
    const endH=endDate.getHours(),endM=endDate.getMinutes();
    const names=members.map(x=>x.name).filter(Boolean);
    const desiredSummary=names.join(' + ');

    const event={
      summary:desiredSummary,
      description:'Horario fijo de Mis Clases',
      start:{dateTime:`${date}T${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:00`,timeZone:tz},
      end:{dateTime:`${date}T${String(endH).padStart(2,'0')}:${String(endM).padStart(2,'0')}:00`,timeZone:tz},
      recurrence:[`RRULE:FREQ=WEEKLY;BYDAY=${['SU','MO','TU','WE','TH','FR','SA'][dow]}`],
      extendedProperties:{private:{mis_clases:'1',student:names.join(' + '),kind:'fixed',grouped:members.length>1?'1':'0',weekday:String(selectedDay),time:g.time}}
    };

    // Intentamos reutilizar un evento ya existente que corresponda al mismo grupo.
    let eventId=oldMap[groupKey]||null;
    if(!eventId){
      for(const [id,ev] of existingFixed){
        if(usedIds.has(id))continue;
        const pp=ev.extendedProperties?.private||{};
        const evNames=String(pp.student||'').split(' + ').map(x=>x.trim()).filter(Boolean).sort().join('|');
        const wanted=names.slice().sort().join('|');
        const evDow=Number(pp.weekday);
        const evTime=String(pp.time||ev.start?.dateTime||'').slice(11,16);
        if(evNames===wanted && evDow===selectedDay && evTime===g.time){eventId=id;break;}
      }
    }

    if(eventId){
      try{
        await googleApi(`calendars/${encodeURIComponent(googleCalendarId)}/events/${encodeURIComponent(eventId)}`,{method:'PUT',body:JSON.stringify(event)});
      }catch(e){
        const msg=String(e.message||e);
        if(!['Not Found','Resource has been deleted','404','410'].some(x=>msg.includes(x)))throw e;
        eventId=null;
      }
    }
    if(!eventId){
      const ev=await googleApi(`calendars/${encodeURIComponent(googleCalendarId)}/events`,{method:'POST',body:JSON.stringify(event)});
      eventId=ev.id;
    }

    usedIds.add(eventId);
    // Guardamos el mismo ID por alumno/día para que lluvia pueda borrar una sola ocurrencia.
    for(const st of members){
      newMap[`${st.id}|${selectedDay}`]=eventId;
    }
    newMap[groupKey]=eventId;
  }

  // Borra eventos fijos antiguos/duplicados que ya no representan horarios actuales.
  for(const [oldId] of existingFixed){
    if(usedIds.has(oldId))continue;
    try{
      await googleApi(`calendars/${encodeURIComponent(googleCalendarId)}/events/${encodeURIComponent(oldId)}`,{method:'DELETE'});
    }catch(e){
      const msg=String(e.message||e);
      if(!['Not Found','Resource has been deleted','404','410'].some(x=>msg.includes(x)))throw e;
    }
  }

  await setConfig(key,JSON.stringify(newMap));
}

async function googleTokenFunction(body){

  const res=await fetch(GOOGLE_TOKEN_FUNCTION,{method:'POST',headers:{'Authorization':'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const text=await res.text();let data={};try{data=text?JSON.parse(text):{}}catch{}

}

async function handleGoogleOAuthCallback(){
  const params=new URLSearchParams(window.location.search);
  const code=params.get('code');
  const state=params.get('state');
  const error=params.get('error');
  if(!code&&!error)return false;
  if(error)throw new Error('Google canceló la conexión: '+error);
  const expected=sessionStorage.getItem('google_oauth_state');
  if(!state||!expected||state!==expected)throw new Error('No se pudo validar la conexión con Google.');
  sessionStorage.removeItem('google_oauth_state');
  const data=await googleTokenFunction({action:'exchange',code,redirect_uri:GOOGLE_REDIRECT_URI});
  googleToken=data.access_token||null;
  if(data.calendar_id)googleCalendarId=data.calendar_id;
  window.history.replaceState({},document.title,window.location.pathname);
  // Primera conexión/reconexión: limpiar todos los calendarios “Clases” viejos y duplicados.
  const reset=await resetGoogleCalendars();
  await syncAllToGoogle();
  alert(`Google Calendar reiniciado. ${Number(reset.deletedCalendars||0)} calendario(s) “Clases” eliminado(s) y ${Number(reset.deletedEvents||0)} evento(s) borrado(s). Se creó un único calendario “Clases” limpio.`);
  updateGoogleStatus();
  return true;
}

async function syncActivitiesToGoogle(){
  if(!googleCalendarId)return;
  normalizeActivities();
  const key='google_activity_event_ids';
  let oldMap={};
  try{oldMap=JSON.parse(await getConfig(key)||'{}')}catch{}
  const existingByKey={};
  const existingIdsByKey={};
  let pageToken='';
  do{
    const q=`calendars/${encodeURIComponent(googleCalendarId)}/events?singleEvents=false&showDeleted=false&maxResults=250&privateExtendedProperty=${encodeURIComponent('kind=activity')}${pageToken?'&pageToken='+encodeURIComponent(pageToken):''}`;
    const page=await googleApi(q,{method:'GET'});
    for(const ev of (page.items||[])){
      const p=ev.extendedProperties?.private||{};
      if(p.kind!=='activity')continue;
      const aid=String(p.activity_id||'');
      const date=String(p.activity_date||ev.start?.dateTime?.slice(0,10)||'');
      if(aid&&date){
        const k=`${aid}|${date}`;
        existingByKey[k]=ev.id;
        existingIdsByKey[k]=ev.id;
      }
    }
    pageToken=page.nextPageToken||'';
  }while(pageToken);

  const wanted=new Set();
  const managedKeys=new Set();
  const newMap={};
  // Manage a window that includes recent past dates so a recent occurrence such as 06/10
  // can be recreated if its Calendar event was removed.
  const allOccurrences=activityUpcoming(120,true,60);
  for(const o of allOccurrences){
    const occKey=`${o.activityId}|${o.date}`;
    managedKeys.add(occKey);
    const occ=(data.activities.find(a=>String(a.id)===String(o.activityId))?.occurrences||{})[o.date]||{};
    const existingId=existingByKey[occKey]||oldMap[occKey]||null;
    if(occ.status==='not_required'){
      if(existingId){
        try{await googleApi(`calendars/${encodeURIComponent(googleCalendarId)}/events/${encodeURIComponent(existingId)}`,{method:'DELETE'})}
        catch(e){if(!['Not Found','Resource has been deleted','404','410'].some(x=>String(e.message).includes(x)))throw e}
      }
      delete oldMap[occKey];
      continue;
    }
    const dt=googleDateTime(o.date,o.time,o.duration);
    const body={summary:'Escuelita',description:o.status==='Me pagaron'?`Escuelita pagada · ${money(o.amount)}`:(o.status==='Me necesitaron'?`Escuelita confirmada · ${money(o.amount)}`:'Escuelita a confirmar'),start:{dateTime:dt.start,timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone},end:{dateTime:dt.end,timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone},extendedProperties:{private:{mis_clases:'1',kind:'activity',activity_id:String(o.activityId),activity_date:o.date,status:o.status}}};
    let id=existingId;
    if(id){
      try{await googleApi(`calendars/${encodeURIComponent(googleCalendarId)}/events/${encodeURIComponent(id)}`,{method:'PUT',body:JSON.stringify(body)})}
      catch(e){if(['Not Found','Resource has been deleted','404','410'].some(x=>String(e.message).includes(x)))id=null;else throw e}
    }
    if(!id){const ev=await googleApi(`calendars/${encodeURIComponent(googleCalendarId)}/events`,{method:'POST',body:JSON.stringify(body)});id=ev.id;}
    newMap[occKey]=id;wanted.add(id);
  }
  // Only clean events belonging to dates in the managed window.
  // Older Escuelita events are historical and must never be deleted by a normal sync.
  for(const occKey of managedKeys){
    const id=existingIdsByKey[occKey];
    if(!id || wanted.has(id))continue;
    try{await googleApi(`calendars/${encodeURIComponent(googleCalendarId)}/events/${encodeURIComponent(id)}`,{method:'DELETE'})}
    catch(e){if(!['Not Found','Resource has been deleted','404','410'].some(x=>String(e.message).includes(x)))throw e}
  }
  await setConfig(key,JSON.stringify(newMap));
}

  }else{
    const h=Number(v.hours||0),selectedId=v.classToSuspend;

      if(original){original.status='Lluvia';original.note=(original.note?original.note+' · ':'')+'Suspendida por lluvia';original.rainSuspensionId=rainId;}
    }else{
      const cancelId=newUuid();
      data.cancellations.push({id:cancelId,student:x.name,date:occDate,hours:h,note:v.note||'Cancelada por el alumno',originalClassId:original?.id||null,fixedOccurrenceId:isFixed?selectedId:null,fixedStudentId:isFixed?String(x.id):null,fixedTime:isFixed?occTime:null});
      if(original){original.status='Cancelada';original.note=(original.note?original.note+' · ':'')+'Cancelada por el alumno';}
    }
  }
  closeModal(); await save();
}

async function setStudentClassStatus(occurrenceId,status,studentId){
 const fixed=String(occurrenceId).startsWith('fixed-'),x=data.students.find(a=>String(a.id)===String(studentId));

 const matches=r=>String(r.fixedOccurrenceId||r.originalClassId||'')===String(occurrenceId);
 const oldRain=(data.rain||[]).filter(matches),rainHours=oldRain.reduce((sum,r)=>sum+Number(r.hours||0),0);
 x.rainHours=Math.max(0,Number(x.rainHours||0)-rainHours);

  if(!schedule){alert('No encontré el horario semanal de esta clase.');return}

 }

  else{if(c.status!=='Lluvia'&&c.status!=='Cancelada'){c.baseStatus=c.status;c.baseNote=c.note||''}c.status=status==='rain'?'Lluvia':'Cancelada';c.note=status==='rain'?'Suspendida por lluvia':'Cancelada por el alumno'}
 }
 if(status==='rain'){
  x.rainHours=Number(x.rainHours||0)+duration;
  data.rain.push({id:newUuid(),student:x.name,date,hours:duration,note:'Suspensión por lluvia',originalClassId:fixed?null:occurrenceId,fixedOccurrenceId:fixed?occurrenceId:null,fixedStudentId:fixed?String(x.id):null,fixedTime:fixed?time:null});
 }else if(status==='cancel'){
  data.cancellations.push({id:newUuid(),student:x.name,date,hours:duration,note:'Cancelada por el alumno',originalClassId:fixed?null:occurrenceId,fixedOccurrenceId:fixed?occurrenceId:null,fixedStudentId:fixed?String(x.id):null,fixedTime:fixed?time:null});
 }
 if(fixed){
  data.fixedOverrides=(data.fixedOverrides||[]).filter(v=>String(v.fixedOccurrenceId)!==String(occurrenceId));
  data.fixedOverrides.push({id:occurrenceId,fixedOccurrenceId:occurrenceId,fixedStudentId:String(x.id),student:x.name,date,time,duration,status,note:status==='rain'?'Suspendida por lluvia':status==='cancel'?'Cancelada por el alumno':''});
 }
 await save();renderStudentDetail();renderClassesList();
}

on.reload()}}loadAppearance();document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
const authGate=document.getElementById('authGate'),authForm=document.getElementById('authForm'),authError=document.getElementById('authError'),authLoading=document.getElementById('authLoading');
function showAuthError(msg){authError.textContent=msg;authError.style.display='block'}
function hideAuthError(){authError.textContent='';authError.style.display='none'}
let currentSession=null;
async function loadFromSupabase(){
  if(!currentSession) return false;
  try{
    // Keep the current local cache available in case this is the first device
    // connecting after the data was created locally.
    const localSnapshot=JSON.parse(localStorage.getItem(KEY)||"null");
    const [aRes,hRes,cRes,pRes,plRes,tRes,cfgRes]=await Promise.all([
      supabaseClient.from('alumnos').select('*').order('created_at'),
      supabaseClient.from('horarios_fijos').select('*'),
      supabaseClient.from('clases').select('*').order('fecha').order('hora'),
      supabaseClient.from('pagos').select('*').order('fecha'),
      supabaseClient.from('planes').select('*').order('created_at'),
      supabaseClient.from('tarifas').select('*').eq('activa',true),
      supabaseClient.from('configuracion').select('clave,valor').in('clave',['actividades_recurrentes','cancelaciones_alumno','suspensiones_lluvia','estados_clases_fijas'])
    ]);
    for(const r of [aRes,hRes,cRes,pRes,plRes,tRes,cfgRes]) if(r.error) throw r.error;

    // Supabase is the source of truth. Never migrate stale localStorage automatically;
    // otherwise an empty/new device could resurrect old students, classes or suspensions.
    const remoteStudents=aRes.data||[];
    const remotePayments=(pRes.data||[]).filter(p=>p.estado==='pagado');
    const nameById={};
    remoteStudents.forEach(st=>nameById[st.id]=st.nombre);

    data.students=remoteStudents.map(st=>{
      const fs=(hRes.data||[]).filter(h=>h.alumno_id===st.id&&h.activo);
      const groups={};fs.forEach(h=>{const key=String(h.hora).slice(0,5)+'|'+Number(h.duracion_minutos||60);(groups[key]??={active:true,days:[],time:String(h.hora).slice(0,5),duration:Number(h.duracion_minutos||60)/60}).days.push(Number(h.dia_semana));});
      return {
        id:st.id,name:st.nombre,age:st.edad||'',level:st.nivel||'',notes:st.notas||'',
        tariff:st.tarifa_tipo||'individual',price:Number(st.precio||0)||data.rates.individual,
        paid:!!st.pagado,hits:st.golpes||{},rainHours:Number(st.lluvia_horas||0),
        recoveredHours:Number(st.recuperadas_horas||0),startDate:st.fecha_inicio||'',
        fixedSchedule:Object.values(groups)
      };
    });

    // Payments are authoritative too; if a payment exists for an active student, reflect it.
    const paidByStudent={};
    remotePayments.forEach(p=>{paidByStudent[p.alumno_id]=true;});
    data.students.forEach(st=>{ if(paidByStudent[st.id]) st.paid=true; });

    data.classes=(cRes.data||[]).map(c=>({
      id:c.id,student:nameById[c.alumno_id]||'',date:c.fecha,time:String(c.hora||'').slice(0,5),
      duration:Number(c.duracion_minutos||60)/60,
      status:c.tipo==='recuperacion'?'Recuperación':(c.estado==='suspendida'?'Lluvia':(c.estado==='cancelada'?'Cancelada':'Clase suelta')),note:c.notas||''
    }));
    const rainConfig=(cfgRes.data||[]).find(x=>x.clave==='suspensiones_lluvia');
    if(rainConfig?.valor){try{data.rain=JSON.parse(rainConfig.valor)||[]}catch{data.rain=[]}}
    else data.rain=(cRes.data||[]).filter(c=>c.estado==='suspendida').map(c=>({
      id:c.id,student:nameById[c.alumno_id]||'',date:c.fecha,hours:Number(c.duracion_minutos||60)/60,note:c.notas||'',recoveryId:null,originalClassId:null,fixedOccurrenceId:null,fixedStudentId:null,fixedTime:String(c.hora||'').slice(0,5)
    }));
    const cancellationConfig=(cfgRes.data||[]).find(x=>x.clave==='cancelaciones_alumno');if(cancellationConfig?.valor){try{data.cancellations=JSON.parse(cancellationConfig.valor)||[]}catch{data.cancellations=[]}} else data.cancellations=[];
    const fixedStateConfig=(cfgRes.data||[]).find(x=>x.clave==='estados_clases_fijas');if(fixedStateConfig?.valor){try{data.fixedOverrides=JSON.parse(fixedStateConfig.valor)||[]}catch{data.fixedOverrides=[]}}else data.fixedOverrides=[];
    const activityConfig=(cfgRes.data||[]).find(x=>x.clave==='actividades_recurrentes');
    if(activityConfig?.valor){try{data.activities=JSON.parse(activityConfig.valor)||[]}catch{data.activities=[]}}
    else if(!Array.isArray(data.activities)) data.activities=[];
    normalizeActivities();
    const remoteRates=tRes.data||[];
    for(const r of remoteRates){
      if(r.tipo==='por_clase') data.rates.class=Number(r.precio||0);
      if(r.tipo==='mensual_individual') data.rates.individual=Number(r.precio||0);
      if(r.tipo==='mensual_grupal') data.rates.group=Number(r.precio||0);
    }
    data.payments=remotePayments.map(p=>({id:p.id,student:nameById[p.alumno_id]||'',amount:Number(p.monto||0),type:p.concepto||'individual',date:p.fecha}));
    data.plans=(plRes.data||[]).map(p=>{const parts=(p.notas||'').split(/\n\n/);return {id:p.id,title:p.nombre,game:parts[0]||'',conditioned:parts[1]||'',task:parts[2]||'',regulated:parts[3]||'',situation:p.situacion||'',tactical:p.objetivo_tactico||'',technical:p.herramienta_tecnica||'',control:p.elemento_control||'',bio:p.principio_biomecanico||'',student:p.descripcion||''};});
    localStorage.setItem(KEY,JSON.stringify(data));
    return true;
  }catch(err){
    console.error('Supabase load error:',err);
    showAuthError('No se pudieron cargar los datos: '+(err.message||err));
    return false;
  }
}
let appEntered=false; async function enterApp(){if(appEntered)return;appEntered=true;hideAuthError();authGate.style.display='none';authLoading.style.display='none';renderAll();try{const loaded=await Promise.race([loadFromSupabase(),new Promise((_,reject)=>setTimeout(()=>reject(new Error('La carga de datos tardó demasiado.')),10000))]);if(!loaded){throw new Error('No se pudieron cargar los datos.')}}catch(e){console.error('Carga inicial:',e);showAuthError('La sesión se inició, pero no se pudieron cargar los datos: '+(e.message||e));authGate.style.display='flex';appEntered=false;return}try{await initGoogleCalendar()}catch(e){console.warn('Google Calendar:',e)}try{const handled=await handleGoogleOAuthCallback();if(handled)alert('Google Calendar conectado. Tus clases se sincronizarán automáticamente.')}catch(e){console.error('Google OAuth callback:',e);alert('No se pudo conectar Google Calendar: '+(e.message||e));window.history.replaceState({},document.title,window.location.pathname)}renderAll()}
async function initAuth(){authLoading.style.display='block';try{const {data:{session}}=await supabaseClient.auth.getSession();currentSession=session;if(session){await enterApp()}else{authGate.style.display='flex'}}catch(err){showAuthError('No se pudo comprobar la sesión: '+(err.message||err));authGate.style.display='flex'}finally{authLoading.style.display='none'}}
authForm.addEventListener('submit',async e=>{e.preventDefault();hideAuthError();authLoading.textContent='Iniciando sesión…';authLoading.style.display='block';const email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPassword').value;const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});authLoading.style.display='none';if(error){showAuthError(error.message.includes('Email not confirmed')?'El email todavía no está confirmado en Supabase.':error.message);return}if(data.session)enterApp()});
supabaseClient.auth.onAuthStateChange((event,session)=>{currentSession=session;if(session && event==='SIGNED_IN')enterApp()});
initAuth();
