      if(old&&old.length){const {error}=await supabaseClient.from('horarios_fijos').update({activo:false}).eq('alumno_id',st.id);if(error)throw error;}
      for(const f of schedules){if(!f?.time)continue;for(const day of (f.days||[f.day])){const hrow={alumno_id:st.id,dia_semana:Number(day||0),hora:f.time,duracion_minutos:Math.round(Number(f.duration||1)*60),activo:true};const {error}=await supabaseClient.from('horarios_fijos').insert(hrow);if(error)throw error;}}
    }

    // 2) Clases
    for(const c of data.classes){
      if(!isUuid(c.id)) c.id=newUuid();

      const tipo=(c.status==='Recuperación'||c.status==='recuperacion')?'recuperacion':'individual';

      const {error}=await supabaseClient.from('clases').upsert({id:c.id,alumno_id:st.id,fecha:c.date,hora:c.time||'00:00',duracion_minutos:Math.round(Number(c.duration||1)*60),tipo,estado,notas:c.note||null},{onConflict:'id'});

    // 3) Pagos
    for(const pay of data.payments){

      const {error}=await supabaseClient.from('pagos').upsert({id:pay.id,alumno_id:st.id,monto:Number(pay.amount||0),fecha:pay.date||new Date().toISOString().slice(0,10),concepto:pay.type||null,estado:'pagado'},{onConflict:'id'});

    }

    for(const pl of data.plans){

    const rateRows=[

      {tipo:'mensual_individual',nombre:'Individual mensual',precio:Number(data.rates.individual||0),activa:true},
      {tipo:'mensual_grupal',nombre:'Grupal mensual',precio:Number(data.rates.group||0),activa:true}
    ];
    for(const r of rateRows){
      const {error}=await supabaseClient.from('tarifas').upsert(r,{onConflict:'tipo'});
      if(error) throw error;
    }

    // 6) Suspensiones por lluvia. Se guardan como clases suspendidas.
    for(const rain of data.rain||[]){
      if(!isUuid(rain.id)) rain.id=newUuid();

    await setConfig('actividades_recurrentes',JSON.stringify(data.activities||[]));
    await setConfig('cancelaciones_alumno',JSON.stringify(data.cancellations||[]));
    localStorage.setItem(KEY,JSON.stringify(data));
    return {ok:true};
  }catch(err){console.error('Supabase sync error:',err);return {ok:false,error:err};}
}

function normalizeActivities(){
  const list=Array.isArray(data.activities)?data.activities:[];
  const out=[];
  const byKey=new Map();
  for(const raw of list){
    if(!raw) continue;
    const a={...raw};
    a.name='Escuelita';
    a.days=[...new Set((Array.isArray(a.days)?a.days:[]).map(Number).filter(n=>n>=0&&n<=6))].sort((x,y)=>x-y);
    a.time=String(a.time||'');
    a.duration=Number(a.duration||1);
    a.amount=Number(a.amount||0);
    a.occurrences={...(a.occurrences||{})};
    // Exact duplicate configurations are one Escuelita, not multiple recurring activities.
    const key=`${a.days.join(',')}|${a.time}|${a.duration}`;
    const existing=byKey.get(key);
    if(!existing){
      byKey.set(key,a);
      out.push(a);
    }else{
      // Keep the first configured amount, but preserve any per-date decisions from duplicates.
      if(!existing.amount && a.amount) existing.amount=a.amount;
      for(const [date,occ] of Object.entries(a.occurrences)){
        if(!existing.occurrences[date] || existing.occurrences[date].status==='not_required') existing.occurrences[date]=occ;
      }
    }
  }
  data.activities=out;
  return out;
}

}

async function cleanupGoogleOrphans(){
  if(!googleCalendarId)return;
  const active=new Set(data.students.map(x=>String(x.name).trim()).filter(Boolean));
  let pageToken='';
  do{
    const dataPage=await googleApi(`calendars/${encodeURIComponent(googleCalendarId)}/events?singleEvents=false&showDeleted=false&maxResults=250${pageToken?'&pageToken='+encodeURIComponent(pageToken):''}`);
    for(const ev of (dataPage.items||[])){
      const pp=ev.extendedProperties?.private||{};
      if(pp.mis_clases!=='1')continue;
      const kind=String(pp.kind||'');
      // Cada tipo de evento se sincroniza por separado. Nunca borrar Escuelita
      // ni otros tipos desde la limpieza de alumnos/clases.
      if(kind==='activity')continue;
      if(kind!=='class' && kind!=='fixed')continue;
      const rawNames=String(pp.student||ev.summary||'').trim();
      const names=rawNames.split(' + ').map(x=>x.trim()).filter(Boolean);
      const looksLikeOurEvent=kind==='class'||kind==='fixed'||String(ev.summary||'').startsWith('R - ');
      if(looksLikeOurEvent && names.length && !names.every(n=>active.has(n))){
        try{await googleApi(`calendars/${encodeURIComponent(googleCalendarId)}/events/${encodeURIComponent(ev.id)}`,{method:'DELETE'})}
        catch(e){if(!['Not Found','Resource has been deleted','404','410'].some(x=>String(e.message).includes(x)))throw e}
      }
    }
    pageToken=dataPage.nextPageToken||'';
  }while(pageToken);
}

async function syncFixedSchedulesToGoogle(){
  const key='google_fixed_event_ids';
  let oldMap={};
  try{oldMap=JSON.parse(await getConfig(key)||'{}')}catch{}
  const tz=Intl.DateTimeFormat().resolvedOptions().timeZone;

    const qs=`singleEvents=false&showDeleted=false&maxResults=250${pageToken?'&pageToken='+encodeURIComponent(pageToken):''}`;
    const page=await googleApi(`calendars/${encodeURIComponent(googleCalendarId)}/events?${qs}`);

      const pp=ev.extendedProperties?.private||{};

    const raw=st.fixedSchedule;
    const schedules=Array.isArray(raw)?raw:(raw?.active?[raw]:[]);

      if(!sch?.active||!sch.time)continue;

          ? `group|${selectedDay}|${time}|${duration}`
          : `student|${st.id}|${selectedDay}|${time}|${duration}`;
        if(!groups.has(groupKey))groups.set(groupKey,{day:selectedDay,time,duration,members:[]});
        const groupMembers=groups.get(groupKey).members;
        if(!groupMembers.some(x=>String(x.id)===String(st.id)))groupMembers.push(st);
      }
    }
  }

  const newMap={};
  const usedIds=new Set();
  for(const [groupKey,g] of groups){
    const members=g.members;
    const selectedDay=Number(g.day);
    const dow=(selectedDay+1)%7; // Google: Sun=0, Mon=1...
    const [hh,mm]=g.time.split(':').map(Number);
    const start=new Date();
    start.setHours(hh,mm,0,0);
    const today=start.getDay();
    let daysUntil=(dow-today+7)%7;
    if(daysUntil===0 && start.getTime()<=Date.now())daysUntil=7;
    start.setDate(start.getDate()+daysUntil);
    const date=start.toISOString().slice(0,10);
    const endDate=new Date(start.getTime()+g.duration*3600000);
    const endH=endDate.getHours(),endM=endDate.getMinutes();
    const names=members.map(x=>x.name).filter(Boolean);
    const desiredSummary=names.join(' + ');

    const event={
      summary:desiredSummary,
      description:'Horario fijo de Mis Clases',
      start:{dateTime:`${date}T${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:00`,timeZone:tz},
      end:{dateTime:`${date}T${String(endH).padStart(2,'0')}:${String(endM).padStart(2,'0')}:00`,timeZone:tz},
      recurrence:[`RRULE:FREQ=WEEKLY;BYDAY=${['SU','MO','TU','WE','TH','FR','SA'][dow]}`],
      extendedProperties:{private:{mis_clases:'1',student:names.join(' + '),kind:'fixed',grouped:members.length>1?'1':'0',weekday:String(selectedDay),time:g.time}}
    };

    // Intentamos reutilizar un evento ya existente que corresponda al mismo grupo.
    let eventId=oldMap[groupKey]||null;
    if(!eventId){
      for(const [id,ev] of existingFixed){
        if(usedIds.has(id))continue;
        const pp=ev.extendedProperties?.private||{};
        const evNames=String(pp.student||'').split(' + ').map(x=>x.trim()).filter(Boolean).sort().join('|');
        const wanted=names.slice().sort().join('|');
        const evDow=Number(pp.weekday);
        const evTime=String(pp.time||ev.start?.dateTime||'').slice(11,16);
        if(evNames===wanted && evDow===selectedDay && evTime===g.time){eventId=id;break;}
      }
    }

    if(eventId){
      try{
        await googleApi(`calendars/${encodeURIComponent(googleCalendarId)}/events/${encodeURIComponent(eventId)}`,{method:'PUT',body:JSON.stringify(event)});
      }catch(e){
        const msg=String(e.message||e);
        if(!['Not Found','Resource has been deleted','404','410'].some(x=>msg.includes(x)))throw e;
        eventId=null;
      }
    }
    if(!eventId){
      const ev=await googleApi(`calendars/${encodeURIComponent(googleCalendarId)}/events`,{method:'POST',body:JSON.stringify(event)});
      eventId=ev.id;
    }

    usedIds.add(eventId);
    // Guardamos el mismo ID por alumno/día para que lluvia pueda borrar una sola ocurrencia.
    for(const st of members){
      newMap[`${st.id}|${selectedDay}`]=eventId;
    }
    newMap[groupKey]=eventId;
  }

  // Borra eventos fijos antiguos/duplicados que ya no representan horarios actuales.
  for(const [oldId] of existingFixed){
    if(usedIds.has(oldId))continue;
    try{
      await googleApi(`calendars/${encodeURIComponent(googleCalendarId)}/events/${encodeURIComponent(oldId)}`,{method:'DELETE'});
    }catch(e){
      const msg=String(e.message||e);
      if(!['Not Found','Resource has been deleted','404','410'].some(x=>msg.includes(x)))throw e;
    }
  }

  await setConfig(key,JSON.stringify(newMap));
}

async function googleTokenFunction(body){
  const {data:{session}}=await supabaseClient.auth.getSession();
  if(!session) throw new Error('La sesión de Mis Clases no está activa.');
  currentSession=session;
  const res=await fetch(GOOGLE_TOKEN_FUNCTION,{method:'POST',headers:{'Authorization':'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const text=await res.text();let data={};try{data=text?JSON.parse(text):{}}catch{}
  if(!res.ok) throw new Error(data.error||('Google Calendar token error '+res.status));
  return data;
}
async function refreshPersistentGoogleToken(){
  const data=await googleTokenFunction({action:'refresh'});
  if(data.connected===false){googleToken=null;return false;}
  googleToken=data.access_token||null;
  if(data.calendar_id) googleCalendarId=data.calendar_id;
  return !!googleToken;
}
async function getGoogleClientId(){
  const data=await googleTokenFunction({action:'client_id'});
  if(!data.client_id) throw new Error('No se configuró GOOGLE_CLIENT_ID en Supabase.');
  return data.client_id;
}
function connectGoogleCalendar(){
  getGoogleClientId().then(clientId=>{
    const state=crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+Math.random();
    sessionStorage.setItem('google_oauth_state',state);
    const params=new URLSearchParams({client_id:clientId,redirect_uri:GOOGLE_REDIRECT_URI,response_type:'code',scope:GOOGLE_SCOPE,access_type:'offline',prompt:'consent',include_granted_scopes:'true',state});
    window.location.href='https://accounts.google.com/o/oauth2/v2/auth?'+params.toString();
  }).catch(e=>{console.error(e);alert('No se pudo iniciar Google Calendar: '+(e.message||e))});
}
async function handleGoogleOAuthCallback(){
  const params=new URLSearchParams(window.location.search);
  const code=params.get('code');
  const state=params.get('state');
  const error=params.get('error');
  if(!code&&!error)return false;
  if(error)throw new Error('Google canceló la conexión: '+error);
  const expected=sessionStorage.getItem('google_oauth_state');
  if(!state||!expected||state!==expected)throw new Error('No se pudo validar la conexión con Google.');
  sessionStorage.removeItem('google_oauth_state');
  const data=await googleTokenFunction({action:'exchange',code,redirect_uri:GOOGLE_REDIRECT_URI});
  googleToken=data.access_token||null;
  if(data.calendar_id)googleCalendarId=data.calendar_id;
  window.history.replaceState({},document.title,window.location.pathname);
  await syncAllToGoogle();
  updateGoogleStatus();
  return true;
}
async function ensureGoogleAccessToken(){
  if(googleToken)return googleToken;
  const ok=await refreshPersistentGoogleToken();
  if(!ok)throw new Error('Google Calendar no está conectado.');
  return googleToken;
}

async function syncActivitiesToGoogle(){
  if(!googleCalendarId)return;
  normalizeActivities();
  const key='google_activity_event_ids';
  let oldMap={};
  try{oldMap=JSON.parse(await getConfig(key)||'{}')}catch{}
  const existingByKey={};
  const existingIdsByKey={};
  let pageToken='';
  do{
    const q=`calendars/${encodeURIComponent(googleCalendarId)}/events?singleEvents=false&showDeleted=false&maxResults=250&privateExtendedProperty=${encodeURIComponent('kind=activity')}${pageToken?'&pageToken='+encodeURIComponent(pageToken):''}`;
    const page=await googleApi(q,{method:'GET'});
    for(const ev of (page.items||[])){
      const p=ev.extendedProperties?.private||{};
      if(p.kind!=='activity')continue;
      const aid=String(p.activity_id||'');
      const date=String(p.activity_date||ev.start?.dateTime?.slice(0,10)||'');
      if(aid&&date){
        const k=`${aid}|${date}`;
        existingByKey[k]=ev.id;
        existingIdsByKey[k]=ev.id;
      }
    }
    pageToken=page.nextPageToken||'';
  }while(pageToken);

  const wanted=new Set();
  const managedKeys=new Set();
  const newMap={};
  // Manage a window that includes recent past dates so a recent occurrence such as 06/10
  // can be recreated if its Calendar event was removed.
  const allOccurrences=activityUpcoming(120,true,60);
  for(const o of allOccurrences){
    const occKey=`${o.activityId}|${o.date}`;
    managedKeys.add(occKey);
    const occ=(data.activities.find(a=>String(a.id)===String(o.activityId))?.occurrences||{})[o.date]||{};
    const existingId=existingByKey[occKey]||oldMap[occKey]||null;
    if(occ.status==='not_required'){
      if(existingId){
        try{await googleApi(`calendars/${encodeURIComponent(googleCalendarId)}/events/${encodeURIComponent(existingId)}`,{method:'DELETE'})}
        catch(e){if(!['Not Found','Resource has been deleted','404','410'].some(x=>String(e.message).includes(x)))throw e}
      }
      delete oldMap[occKey];
      continue;
    }
    const dt=googleDateTime(o.date,o.time,o.duration);
    const body={summary:'Escuelita',description:o.status==='Me pagaron'?`Escuelita pagada · ${money(o.amount)}`:(o.status==='Me necesitaron'?`Escuelita confirmada · ${money(o.amount)}`:'Escuelita a confirmar'),start:{dateTime:dt.start,timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone},end:{dateTime:dt.end,timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone},extendedProperties:{private:{mis_clases:'1',kind:'activity',activity_id:String(o.activityId),activity_date:o.date,status:o.status}}};
    let id=existingId;
    if(id){
      try{await googleApi(`calendars/${encodeURIComponent(googleCalendarId)}/events/${encodeURIComponent(id)}`,{method:'PUT',body:JSON.stringify(body)})}
      catch(e){if(['Not Found','Resource has been deleted','404','410'].some(x=>String(e.message).includes(x)))id=null;else throw e}
    }
    if(!id){const ev=await googleApi(`calendars/${encodeURIComponent(googleCalendarId)}/events`,{method:'POST',body:JSON.stringify(body)});id=ev.id;}
    newMap[occKey]=id;wanted.add(id);
  }
  // Only clean events belonging to dates in the managed window.
  // Older Escuelita events are historical and must never be deleted by a normal sync.
  for(const occKey of managedKeys){
    const id=existingIdsByKey[occKey];
    if(!id || wanted.has(id))continue;
    try{await googleApi(`calendars/${encodeURIComponent(googleCalendarId)}/events/${encodeURIComponent(id)}`,{method:'DELETE'})}
    catch(e){if(!['Not Found','Resource has been deleted','404','410'].some(x=>String(e.message).includes(x)))throw e}
  }
  await setConfig(key,JSON.stringify(newMap));
}

}

function togglePaid(id){const x=data.students.find(a=>a.id==id);if(!x)return;x.paid=!x.paid;if(x.paid){const existing=data.payments.some(p=>p.student===x.name&&Number(p.amount)===Number(x.price)&&p.type===x.tariff);if(!existing){data.payments.push({id:Date.now(),student:x.name,amount:Number(x.price),type:x.tariff||'individual',date:new Date().toISOString().slice(0,10)});}}else{const idx=[...data.payments].map((p,i)=>[p,i]).reverse().find(([p])=>p.student===x.name&&Number(p.amount)===Number(x.price));if(idx)data.payments.splice(idx[1],1);}save()}function savePayment(e){e.preventDefault();let v=vals(e.target);data.payments.push({id:Date.now(),student:v.student,amount:Number(v.amount),type:v.type,date:v.date});let x=data.students.find(a=>a.name===v.student);if(x)x.paid=true;closeModal();save()}function suggestAmount(){let t=document.getElementById('ptype')?.value;if(document.getElementById('pamount'))document.getElementById('pamount').value=data.rates[t==='class'?'class':t==='group'?'group':'individual']}function saveRates(e){e.preventDefault();let v=vals(e.target);data.rates={class:Number(v.class),individual:Number(v.individual),group:Number(v.group)};closeModal();save()}function savePlan(e,id){e.preventDefault();const v=vals(e.target);if(id){const p=data.plans.find(x=>String(x.id)===String(id));if(p)Object.assign(p,v)}else data.plans.push({id:Date.now(),...v});closeModal();save()}function deletePlan(id){data.plans=data.plans.filter(x=>x.id!=id);save()}function setTheme(v){document.body.classList.toggle('dark',v==='dark');localStorage.setItem('mcTheme',v)}function setFont(v){document.body.classList.remove('font-system','font-inter','font-segoe','font-avenir','font-georgia');document.body.classList.add('font-'+v);localStorage.setItem('mcFont',v)}function loadAppearance(){setTheme(localStorage.getItem('mcTheme')||'light');setFont(localStorage.getItem('mcFont')||'system')}function resetData(){if(confirm('¿Restaurar datos de ejemplo?')){localStorage.removeItem(KEY);location.reload()}}loadAppearance();document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
const authGate=document.getElementById('authGate'),authForm=document.getElementById('authForm'),authError=document.getElementById('authError'),authLoading=document.getElementById('authLoading');
function showAuthError(msg){authError.textContent=msg;authError.style.display='block'}
function hideAuthError(){authError.textContent='';authError.style.display='none'}
let currentSession=null;
async function loadFromSupabase(){
  if(!currentSession) return false;
  try{
    // Keep the current local cache available in case this is the first device
    // connecting after the data was created locally.
    const localSnapshot=JSON.parse(localStorage.getItem(KEY)||"null");
    const [aRes,hRes,cRes,pRes,plRes,tRes,cfgRes]=await Promise.all([
      supabaseClient.from('alumnos').select('*').order('created_at'),
      supabaseClient.from('horarios_fijos').select('*'),
      supabaseClient.from('clases').select('*').order('fecha').order('hora'),
      supabaseClient.from('pagos').select('*').order('fecha'),
      supabaseClient.from('planes').select('*').order('created_at'),
      supabaseClient.from('tarifas').select('*').eq('activa',true),
      supabaseClient.from('configuracion').select('clave,valor').in('clave',['actividades_recurrentes'])
    ]);
    for(const r of [aRes,hRes,cRes,pRes,plRes,tRes,cfgRes]) if(r.error) throw r.error;

    // If Supabase is genuinely empty but this device has local data, migrate it once.
    // This is important for the first PC->Supabase transition.
    const remoteStudents=aRes.data||[];
    const remoteHasData=remoteStudents.length || (cRes.data||[]).length || (pRes.data||[]).length || (plRes.data||[]).length || (tRes.data||[]).length;
    if(!remoteHasData && localSnapshot && Array.isArray(localSnapshot.students) && localSnapshot.students.length){
      const previous=data;
      data=localSnapshot;
      const migrated=await syncToSupabase();
      if(migrated.ok){
        return await loadFromSupabase();
      }
      data=previous;
      throw migrated.error||new Error('No se pudo migrar la información local a Supabase');
    }
    const remotePayments=(pRes.data||[]).filter(p=>p.estado==='pagado');
    const nameById={};
    remoteStudents.forEach(st=>nameById[st.id]=st.nombre);

    data.students=remoteStudents.map(st=>{
      const fs=(hRes.data||[]).filter(h=>h.alumno_id===st.id&&h.activo);
      const groups={};fs.forEach(h=>{const key=String(h.hora).slice(0,5)+'|'+Number(h.duracion_minutos||60);(groups[key]??={active:true,days:[],time:String(h.hora).slice(0,5),duration:Number(h.duracion_minutos||60)/60}).days.push(Number(h.dia_semana));});
      return {
        id:st.id,name:st.nombre,age:st.edad||'',level:st.nivel||'',notes:st.notas||'',
        tariff:st.tarifa_tipo||'individual',price:Number(st.precio||0)||data.rates.individual,
        paid:!!st.pagado,hits:st.golpes||{},rainHours:Number(st.lluvia_horas||0),
        recoveredHours:Number(st.recuperadas_horas||0),
        fixedSchedule:Object.values(groups)
      };
    });

    // Payments are authoritative too; if a payment exists for an active student, reflect it.
    const paidByStudent={};
    remotePayments.forEach(p=>{paidByStudent[p.alumno_id]=true;});
    data.students.forEach(st=>{ if(paidByStudent[st.id]) st.paid=true; });

    data.classes=(cRes.data||[]).map(c=>({
      id:c.id,student:nameById[c.alumno_id]||'',date:c.fecha,time:String(c.hora||'').slice(0,5),
      duration:Number(c.duracion_minutos||60)/60,
      status:c.tipo==='recuperacion'?'Recuperación':(c.estado==='suspendida'?'Lluvia':'Clase suelta'),note:c.notas||''
    }));
    data.rain=(cRes.data||[]).filter(c=>c.estado==='suspendida').map(c=>({
      id:c.id,student:nameById[c.alumno_id]||'',date:c.fecha,hours:Number(c.duracion_minutos||60)/60,note:c.notas||'',recoveryId:null
    }));
    const cancellationConfig=(cfgRes.data||[]).find(x=>x.clave==='cancelaciones_alumno');if(cancellationConfig?.valor){try{data.cancellations=JSON.parse(cancellationConfig.valor)||[]}catch{data.cancellations=[]}}
     const activityConfig=(cfgRes.data||[]).find(x=>x.clave==='actividades_recurrentes');
    if(activityConfig?.valor){try{data.activities=JSON.parse(activityConfig.valor)||[]}catch{data.activities=[]}}
    else if(!Array.isArray(data.activities)) data.activities=[];
    normalizeActivities();
    const remoteRates=tRes.data||[];
    for(const r of remoteRates){
      if(r.tipo==='por_clase') data.rates.class=Number(r.precio||0);
      if(r.tipo==='mensual_individual') data.rates.individual=Number(r.precio||0);
      if(r.tipo==='mensual_grupal') data.rates.group=Number(r.precio||0);
    }
    data.payments=remotePayments.map(p=>({id:p.id,student:nameById[p.alumno_id]||'',amount:Number(p.monto||0),type:p.concepto||'individual',date:p.fecha}));
    data.plans=(plRes.data||[]).map(p=>{const parts=(p.notas||'').split(/\n\n/);return {id:p.id,title:p.nombre,game:parts[0]||'',conditioned:parts[1]||'',task:parts[2]||'',regulated:parts[3]||'',situation:p.situacion||'',tactical:p.objetivo_tactico||'',technical:p.herramienta_tecnica||'',control:p.elemento_control||'',bio:p.principio_biomecanico||'',student:p.descripcion||''};});
    data.rain=[];
    localStorage.setItem(KEY,JSON.stringify(data));
    return true;
  }catch(err){
    console.error('Supabase load error:',err);
    showAuthError('No se pudieron cargar los datos: '+(err.message||err));
    return false;
  }
}
let appEntered=false; async function enterApp(){if(appEntered)return;appEntered=true;authGate.style.display='none';await loadFromSupabase();await initGoogleCalendar();renderAll();try{const handled=await handleGoogleOAuthCallback();if(handled)alert('Google Calendar conectado. Tus clases se sincronizarán automáticamente.')}catch(e){console.error('Google OAuth callback:',e);alert('No se pudo conectar Google Calendar: '+(e.message||e));window.history.replaceState({},document.title,window.location.pathname)}}
async function initAuth(){authLoading.style.display='block';try{const {data:{session}}=await supabaseClient.auth.getSession();currentSession=session;if(session){await enterApp()}else{authGate.style.display='flex'}}catch(err){showAuthError('No se pudo comprobar la sesión: '+(err.message||err));authGate.style.display='flex'}finally{authLoading.style.display='none'}}
authForm.addEventListener('submit',async e=>{e.preventDefault();hideAuthError();authLoading.textContent='Iniciando sesión…';authLoading.style.display='block';const email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPassword').value;const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});authLoading.style.display='none';if(error){showAuthError(error.message.includes('Email not confirmed')?'El email todavía no está confirmado en Supabase.':error.message);return}if(data.session)enterApp()});
supabaseClient.auth.onAuthStateChange((event,session)=>{currentSession=session;if(session && event==='SIGNED_IN')enterApp()});
initAuth();
</script></body></html>
